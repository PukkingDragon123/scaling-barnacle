    // cozy dusk tint indoors — the stove and lamp keep it warm
    if (nite > 0.05) {
      ctx.fillStyle = `rgba(10,10,30,${nite * (G.decor.lamp ? 0.14 : 0.2)})`;
      ctx.fillRect(0, 0, W, H);
    }

    // sleep fade
    if (this.sleeping) {
      const a = this.sleepT < 1.1 ? this.sleepT / 1.1 : (2.2 - this.sleepT) / 1.1;
      ctx.fillStyle = `rgba(0,0,0,${clamp(a, 0, 1)})`;
      ctx.fillRect(0, 0, W, H);
      if (this.sleepT > 0.6 && this.sleepT < 1.6)
        text(ctx, 'Zzz...', W / 2, H / 2 - 6, { size: 12, color: '#c8d4e8', align: 'center' });
    }
  },
};

/* ===== js/shop.js ===== */
// ---- ClamNet: the laptop shop overlay ---------------------------------------

const Shop = {
  open: false,
  tab: 0,
  scroll: 0,
  TABS: ['SELL', 'GEAR', 'BUILD', 'DECOR'],
  WX: 24, WY: 16, WW: 432, WH: 238,
  _rows: [],

  openUI() {
    this.open = true;
    this.tab = 0;
    this.scroll = 0;
    SND.blip();
    if (!G.flags.seenShop) {
      G.flags.seenShop = true;
      Game.toast('Sell shells here — a drone picks them up and pays you!');
    }
  },

  close() { this.open = false; SND.click(); },

  buy(price, apply, name) {
    if (G.money < price) {
      SND.alarm();
      Game.toast('Not enough sand dollars!');
      return;
    }
    G.money -= price;
    apply();
    SND.cash();
    Game.toast(`Bought: ${name}`);
    Game.save();
  },

  sellKeys(keys) {
    let v = 0, c = 0;
    for (const k of keys) {
      const n = G.storage[k] || 0;
      v += n * ITEMS[k].price; c += n;
      G.storage[k] = 0;
    }
    if (c === 0) return;
    if (G.pendingCrate) G.pendingCrate.value += v;
    else G.pendingCrate = { value: v, t: 16 };
    SND.click();
    Game.toast(`Order placed: $${v} — drone en route!`);
    Game.save();
  },

  buildRows() {
    const rows = [];
    const push = (r) => rows.push(r);
    if (this.tab === 0) {
      // SELL
      if (G.pendingCrate)
        push({ info: `Drone en route with your crate — $${G.pendingCrate.value} on pickup (${Math.ceil(G.pendingCrate.t)}s)` });
      let total = 0, any = false;
      for (const k of ITEM_KEYS) {
        const n = G.storage[k] || 0;
        if (n <= 0) continue;
        any = true;
        total += n * ITEMS[k].price;
        push({
          icon: SPR.icons[k],
          label: `${ITEMS[k].name}  x${n}`,
          sub: `$${ITEMS[k].price} each`,
          btn: `SELL $${n * ITEMS[k].price}`,
          act: () => this.sellKeys([k]),
        });
      }
      if (!any) push({ info: 'Storage is empty. Go scrape the pilings!' });
      else push({ label: 'SELL EVERYTHING', sub: 'one big crate', btn: `$${total}`, act: () => this.sellKeys(ITEM_KEYS) });
    } else if (this.tab === 1) {
      // GEAR
      const tier = (arr, cur, name, applyKey) => {
        if (cur + 1 < arr.length) {
          const nx = arr[cur + 1];
          push({
            label: nx.name, sub: `${nx.desc}  (now: ${arr[cur].name})`,
            btn: `$${nx.price}`, price: nx.price,
            act: () => this.buy(nx.price, () => { G.gear[applyKey]++; }, nx.name),
          });
        } else {
          push({ label: arr[cur].name, sub: 'Top of the line.', btn: 'MAX' });
        }
      };
      tier(SCRAPERS, G.gear.scraper, 'scraper', 'scraper');
      tier(PRYBARS, G.gear.pry, 'pry', 'pry');
      tier(TANKS, G.gear.tank, 'tank', 'tank');
      tier(SUITS, G.gear.suit, 'suit', 'suit');
      tier(BAGS, G.gear.bag, 'bag', 'bag');
      for (const key of ['lamp', 'gloves']) {
        const it = GEAR_SINGLES[key];
        if (G.gear[key]) push({ label: it.name, sub: it.desc, btn: 'OWNED' });
        else push({ label: it.name, sub: it.desc, btn: `$${it.price}`, price: it.price, act: () => this.buy(it.price, () => { G.gear[key] = true; }, it.name) });
      }
    } else if (this.tab === 2) {
      // BUILD
      if (G.bridge < 3) {
        const b = G.bridge === 1 ? BUILDS.bridge2 : BUILDS.bridge3;
        push({ label: b.name, sub: b.desc, btn: `$${b.price}`, price: b.price, act: () => this.buy(b.price, () => { G.bridge++; }, b.name) });
      } else push({ info: 'The bridge reaches as far as it can go.' });
      if (G.house < 3) {
        const h = G.house === 1 ? BUILDS.house2 : BUILDS.house3;
        push({ label: h.name, sub: h.desc, btn: `$${h.price}`, price: h.price, act: () => this.buy(h.price, () => { G.house++; }, h.name) });
      } else push({ info: 'Your house is the finest on the sea.' });
    } else {
      // DECOR
      for (const d of DECOR) {
        if (G.decor[d.id]) push({ label: d.name, sub: d.desc, btn: 'OWNED' });
        else push({ label: d.name, sub: d.desc, btn: `$${d.price}`, price: d.price, act: () => this.buy(d.price, () => { G.decor[d.id] = true; }, d.name) });
      }
    }
    return rows;
  },

  update(dt) {
    if (Input.p('Escape')) { this.close(); return; }
    for (let i = 0; i < 4; i++)
      if (Input.p('Digit' + (i + 1))) { this.tab = i; this.scroll = 0; SND.blip(); }
    this.scroll = clamp(this.scroll + Input.wheelDelta, 0, 30);

    this._rows = this.buildRows();
    // when the list overflows, the 8th row band becomes the scroll-arrow strip
    this._vis = this._rows.length > 8 ? 7 : 8;
    const maxScroll = Math.max(0, this._rows.length - this._vis);
    this.scroll = clamp(this.scroll, 0, maxScroll);

    if (Input.mouse.clicked) {
      const mx = Input.mouse.x, my = Input.mouse.y;
      // close button (generous hit box for touch)
      if (mx > this.WX + this.WW - 26 && mx < this.WX + this.WW + 4 && my > this.WY - 4 && my < this.WY + 20) { this.close(); return; }
      // scroll arrows (touch has no wheel)
      const ay = this.WY + 44 + 7 * 23;
      if (maxScroll > 0 && mx > this.WX + this.WW - 56 && mx < this.WX + this.WW - 8 && my > ay && my < ay + 20) {
        this.scroll = clamp(this.scroll + (mx > this.WX + this.WW - 32 ? 1 : -1), 0, maxScroll);
        SND.blip();
        return;
      }
      // tabs
      for (let i = 0; i < this.TABS.length; i++) {
        const tx = this.WX + 10 + i * 62;
        if (mx > tx && mx < tx + 56 && my > this.WY + 20 && my < this.WY + 36) {
          this.tab = i; this.scroll = 0; SND.blip(); return;
        }
      }
      // rows
      const y0 = this.WY + 44;
      for (let i = 0; i < this._vis; i++) {
        const r = this._rows[i + this.scroll];
        if (!r || r.info || !r.act) continue;
        const ry = y0 + i * 23;
        if (mx > this.WX + this.WW - 96 && mx < this.WX + this.WW - 12 && my > ry && my < ry + 20) {
          r.act();
          return;
        }
      }
    }
  },

  draw(ctx) {
    // dim world behind
    ctx.fillStyle = 'rgba(4,8,14,0.62)';
    ctx.fillRect(0, 0, W, H);
    // driftwood window
    uiPanel(ctx, this.WX, this.WY, this.WW, this.WH, 0.97);
    // title bar
    ctx.fillStyle = 'rgba(58,42,22,0.95)';
    ctx.fillRect(this.WX + 2, this.WY + 2, this.WW - 4, 15);
    ctx.fillStyle = 'rgba(230,200,150,0.25)';
    ctx.fillRect(this.WX + 2, this.WY + 2, this.WW - 4, PIX);
    // little shell buttons
    ['#e8434c', '#e8b84e', '#4fae6a'].forEach((c, i) => {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(this.WX + 9 + i * 8, this.WY + 9.5, 2.2, 0, TAU); ctx.fill();
    });
    text(ctx, 'ClamNet  ~  otto.sea/market', this.WX + 36, this.WY + 6, { size: 7, color: '#d8c8a8' });
    text(ctx, 'X', this.WX + this.WW - 11, this.WY + 5.5, { size: 8, color: '#e8434c', align: 'center' });
    // money with coin
    drawSpr(ctx, SPR.coin, this.WX + this.WW - 52, this.WY + 22);
    text(ctx, `${G.money}`, this.WX + this.WW - 42, this.WY + 23, { size: 9, color: '#ffe66e' });
    // tabs as hanging wooden tags
    for (let i = 0; i < this.TABS.length; i++) {
      const tx = this.WX + 10 + i * 62;
      const sel = i === this.tab;
      ctx.fillStyle = sel ? '#7a5c34' : '#2e2314';
      ctx.fillRect(tx, this.WY + 21, 56, 15);
      ctx.fillStyle = sel ? 'rgba(255,235,190,0.4)' : 'rgba(255,235,190,0.08)';
      ctx.fillRect(tx, this.WY + 21, 56, 1);
      ctx.fillStyle = sel ? '#c8a03c' : '#4a3a20';
      ctx.fillRect(tx + 26, this.WY + 23, 3, 3);
      text(ctx, this.TABS[i], tx + 28, this.WY + 27, { size: 7, color: sel ? '#ffe6b0' : '#8a7758', align: 'center' });
    }
    // rows: card slats
    const y0 = this.WY + 44;
    const vis = this._vis || 8;
    const mx = Input.mouse.x, my = Input.mouse.y;
    for (let i = 0; i < vis; i++) {
      const r = this._rows[i + this.scroll];
      if (!r) break;
      const ry = y0 + i * 23;
      if (r.info) {
        text(ctx, r.info, this.WX + 16, ry + 6, { size: 7, color: '#b8a888' });
        continue;
      }
      ctx.fillStyle = 'rgba(56,42,24,0.55)';
      ctx.fillRect(this.WX + 8, ry, this.WW - 16, 21);
      ctx.fillStyle = 'rgba(230,200,150,0.12)';
      ctx.fillRect(this.WX + 8, ry, this.WW - 16, PIX);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(this.WX + 8, ry + 20.5, this.WW - 16, PIX);
      let lx = this.WX + 14;
      if (r.icon) { drawSpr(ctx, r.icon, lx, ry + 6); lx += 12; }
      text(ctx, r.label, lx, ry + 3, { size: 8, color: '#f4e8cc' });
      if (r.sub) text(ctx, r.sub, lx, ry + 12, { size: 6, color: '#a89272' });
      if (r.btn) {
        const canAfford = r.price === undefined || G.money >= r.price;
        const active = !!r.act;
        const hov = active && mx > this.WX + this.WW - 96 && mx < this.WX + this.WW - 12 && my > ry && my < ry + 20;
        rrect(ctx, this.WX + this.WW - 96, ry + 2, 84, 17,
          active ? (hov ? '#2c5a44' : '#1c3a2c') : 'rgba(24,18,10,0.7)',
          active ? (canAfford ? '#4fae6a' : '#7a4444') : '#4a3a24');
        text(ctx, r.btn, this.WX + this.WW - 54, ry + 6, {
          size: 7, align: 'center',
          color: !active ? '#6a5a42' : (canAfford ? '#a0f2b4' : '#e88a8a'),
        });
      }
    }
    if (this._rows.length > vis) {
      text(ctx, `${this.scroll + 1}-${this.scroll + vis} of ${this._rows.length}`, this.WX + this.WW / 2, this.WY + this.WH - 12, { size: 6, color: '#8a7758', align: 'center' });
      // tappable scroll arrows in the freed 8th-row band
      const maxScroll = this._rows.length - vis;
      const ax = this.WX + this.WW - 56, ay = y0 + 7 * 23;
      for (let i = 0; i < 2; i++) {
        const canGo = i === 0 ? this.scroll > 0 : this.scroll < maxScroll;
        uiPanel(ctx, ax + i * 24, ay, 22, 19, canGo ? 0.92 : 0.4);
        ctx.fillStyle = canGo ? '#efe0bc' : '#5a4c34';
        const cx2 = ax + i * 24 + 11, cy2 = ay + 9.5, d = i === 0 ? -1 : 1;
        ctx.beginPath();
        ctx.moveTo(cx2, cy2 + 4 * d); ctx.lineTo(cx2 - 5, cy2 - 3 * d); ctx.lineTo(cx2 + 5, cy2 - 3 * d);
        ctx.closePath(); ctx.fill();
      }
    }
    text(ctx, TouchUI.enabled ? 'tap X to close' : '[1-4] tabs   [Esc] close', this.WX + 12, this.WY + this.WH - 12, { size: 6, color: '#8a7758' });
  },
};

/* ===== js/bench.js ===== */
// ---- the workbench: crack shells open, polish treasures ----------------------

const Bench = {
  open: false,
  mode: 'menu',        // menu | crack | polish
  item: null,          // raw item key being worked
  t: 0,
  crackPos: 0,         // 0..1 sweep position
  result: null, resultT: 0,
  shine: 0, lastRubX: 0, rubbing: false, sparkles: [],
  WX: 90, WY: 30, WW: 300, WH: 210,

  openUI() {
    this.open = true;
    this.mode = 'menu';
    this.result = null;
    SND.blip();
    if (!G.flags.seenBench) {
      G.flags.seenBench = true;
      Game.toast('Crack shells for meat, polish treasures — worth way more!');
    }
  },

  close() { this.open = false; SND.click(); },

  crackables() { return Object.keys(BENCH_CRACK).filter(k => (G.storage[k] || 0) > 0); },
  polishables() { return Object.keys(BENCH_POLISH).filter(k => (G.storage[k] || 0) > 0); },

  startCrack(k) {
    this.mode = 'crack'; this.item = k; this.t = 0;
    this.result = null; this.resultT = 0;
    SND.click();
  },

  startPolish(k) {
    this.mode = 'polish'; this.item = k;
    this.shine = 0; this.result = null; this.resultT = 0; this.sparkles = [];
    SND.click();
  },

  resolveCrack() {
    const pos = this.crackPos;
    const off = Math.abs(pos - 0.5);
    G.storage[this.item]--;
    G.stats.cracked++;
    if (off < 0.07) {
      G.storage[BENCH_CRACK[this.item]]++;
      let msg = 'Clean crack!';
      if (this.item === 'oyster' && Math.random() < 0.18) { G.storage.pearl++; msg = 'Clean crack... A PEARL!'; SND.chime(); G.stats.pearls++; }
      this.result = { good: 2, msg };
      SND.crackHit(true);
    } else if (off < 0.17) {
      G.storage[BENCH_CRACK[this.item]]++;
      let msg = 'Cracked it.';
      if (this.item === 'oyster' && Math.random() < 0.06) { G.storage.pearl++; msg = 'Cracked it... a pearl!'; SND.chime(); G.stats.pearls++; }
      this.result = { good: 1, msg };
      SND.crackHit(false);
    } else {
      G.storage.barnacle++;   // smashed to useful bits, at least
      this.result = { good: 0, msg: 'Smashed it to bits...' };
      SND.smash();
    }
    this.resultT = 0.9;
    if (navigator.vibrate) { try { navigator.vibrate(this.result.good ? 15 : 40); } catch (e) {} }
    Game.save();
  },

  finishPolish() {
    G.storage[this.item]--;
    G.storage[BENCH_POLISH[this.item]]++;
    G.stats.polished++;
    this.result = { good: 2, msg: 'Gleaming!' };
    this.resultT = 0.9;
    SND.chime();
    if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
    Game.save();
  },

  update(dt) {
    if (Input.p('Escape')) {
      if (this.mode === 'menu') this.close();
      else { this.mode = 'menu'; SND.click(); }
      return;
    }
    const mx = Input.mouse.x, my = Input.mouse.y;

    if (this.resultT > 0) {
      this.resultT -= dt;
      if (this.resultT <= 0) {
        // chain into the next one of the same shell, or fall back to the menu
        const left = G.storage[this.item] || 0;
        if (left > 0 && this.mode === 'crack') { this.t = 0; this.result = null; }
        else if (left > 0 && this.mode === 'polish') { this.shine = 0; this.result = null; this.sparkles = []; }
        else { this.mode = 'menu'; this.result = null; }
      }
      return;
    }

    if (this.mode === 'menu') {
      if (Input.mouse.clicked) {
        // close X
        if (mx > this.WX + this.WW - 26 && my < this.WY + 20) { this.close(); return; }
        const rows = this.menuRows();
        for (let i = 0; i < rows.length; i++) {
          const ry = this.WY + 46 + i * 26;
          if (my > ry && my < ry + 23 && mx > this.WX + 10 && mx < this.WX + this.WW - 10) {
            rows[i].act();
            return;
          }
        }
      }
    } else if (this.mode === 'crack') {
      this.t += dt;
      this.crackPos = (Math.sin(this.t * 3.4 - Math.PI / 2) + 1) / 2;
      if (Input.mouse.clicked) this.resolveCrack();
    } else if (this.mode === 'polish') {
      const overItem = Math.abs(mx - (this.WX + this.WW / 2)) < 46 && Math.abs(my - (this.WY + 104)) < 40;
      if (Input.mouse.down && overItem) {
        const dx = Math.abs(mx - this.lastRubX);
        if (dx > 0.5) {
          this.shine = Math.min(1, this.shine + dx * 0.006);
          if (Math.random() < 0.35) SND.rub();
          if (Math.random() < 0.5)
            this.sparkles.push({ x: mx + rand(-6, 6), y: my + rand(-8, 4), t: rand(0.3, 0.7) });
        }
        this.rubbing = true;
      } else this.rubbing = false;
      this.lastRubX = mx;
      for (const s of this.sparkles) s.t -= dt;
      this.sparkles = this.sparkles.filter(s => s.t > 0);
      if (this.shine >= 1) this.finishPolish();
    }
  },

  menuRows() {
    const rows = [];
    for (const k of this.crackables())
      rows.push({ icon: SPR.icons[k], label: `Crack ${ITEMS[k].name}  x${G.storage[k]}`, sub: `-> ${ITEMS[BENCH_CRACK[k]].name} ($${ITEMS[BENCH_CRACK[k]].price})`, act: () => this.startCrack(k) });
    for (const k of this.polishables())
      rows.push({ icon: SPR.icons[k], label: `Polish ${ITEMS[k].name}  x${G.storage[k]}`, sub: `-> ${ITEMS[BENCH_POLISH[k]].name} ($${ITEMS[BENCH_POLISH[k]].price})`, act: () => this.startPolish(k) });
    return rows;
  },

  draw(ctx) {
    ctx.fillStyle = 'rgba(4,8,14,0.62)';
    ctx.fillRect(0, 0, W, H);
    uiPanel(ctx, this.WX, this.WY, this.WW, this.WH, 0.97);
    ctx.fillStyle = 'rgba(58,42,22,0.95)';
    ctx.fillRect(this.WX + 2, this.WY + 2, this.WW - 4, 15);
    text(ctx, "~ OTTO'S WORKBENCH ~", this.WX + this.WW / 2, this.WY + 6, { size: 8, color: '#ffe6b0', align: 'center' });
    text(ctx, 'X', this.WX + this.WW - 11, this.WY + 5.5, { size: 8, color: '#e8434c', align: 'center' });

    if (this.mode === 'menu') {
      const rows = this.menuRows();
      if (!rows.length) {
        text(ctx, 'Nothing to work on.', this.WX + this.WW / 2, this.WY + 80, { size: 9, color: '#b8a888', align: 'center' });
        text(ctx, 'Dive for clams, oysters, abalone or pearls!', this.WX + this.WW / 2, this.WY + 96, { size: 7, color: '#8a7758', align: 'center' });
      }
      const mx = Input.mouse.x, my = Input.mouse.y;
      for (let i = 0; i < rows.length && i < 6; i++) {
        const ry = this.WY + 46 + i * 26;
        const hov = my > ry && my < ry + 23 && mx > this.WX + 10 && mx < this.WX + this.WW - 10;
        ctx.fillStyle = hov ? 'rgba(90,66,36,0.7)' : 'rgba(56,42,24,0.55)';
        ctx.fillRect(this.WX + 10, ry, this.WW - 20, 23);
        ctx.fillStyle = 'rgba(230,200,150,0.12)';
        ctx.fillRect(this.WX + 10, ry, this.WW - 20, PIX);
        drawSpr(ctx, rows[i].icon, this.WX + 18, ry + 7);
        text(ctx, rows[i].label, this.WX + 32, ry + 3.5, { size: 8, color: '#f4e8cc' });
        text(ctx, rows[i].sub, this.WX + 32, ry + 13, { size: 6, color: '#a0d2ac' });
      }
      text(ctx, 'crack: tap when the marker hits center  *  polish: rub!', this.WX + this.WW / 2, this.WY + this.WH - 14, { size: 6, color: '#8a7758', align: 'center' });
      return;
    }

    // shared: the item, big, on a work cloth
    const cx = this.WX + this.WW / 2, cy = this.WY + 104;
    ctx.fillStyle = '#5f4a2e';
    ctx.beginPath(); ctx.ellipse(cx, cy + 26, 62, 12, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a6240';
    ctx.beginPath(); ctx.ellipse(cx, cy + 24, 54, 9, 0, 0, TAU); ctx.fill();
    const img = SPR.icons[this.item];
    ctx.save();
    ctx.translate(cx, cy + 4);
    ctx.scale(6.5, 6.5);
    if (this.mode === 'polish' && this.rubbing) ctx.rotate(Math.sin(Input.mouse.x * 0.35) * 0.06);
    ctx.drawImage(img, -img.width / DPX / 2, -img.height / DPX / 2, img.width / DPX, img.height / DPX);
    ctx.restore();

    if (this.mode === 'crack') {
      text(ctx, `Cracking: ${ITEMS[this.item].name}  (x${G.storage[this.item]})`, cx, this.WY + 28, { size: 8, color: '#f4e8cc', align: 'center' });
      // sweep bar
      const bw = 180, bx = cx - bw / 2, by = this.WY + 158;
      rrect(ctx, bx - 2, by - 2, bw + 4, 16, '#181008', '#7e5c34');
      ctx.fillStyle = '#2c1f12';
      ctx.fillRect(bx, by, bw, 12);
      // zones
      ctx.fillStyle = '#3f6a3f';
      ctx.fillRect(bx + bw * 0.33, by, bw * 0.34, 12);
      ctx.fillStyle = '#4fae5e';
      ctx.fillRect(bx + bw * 0.43, by, bw * 0.14, 12);
      ctx.fillStyle = 'rgba(200,255,210,0.6)';
      ctx.fillRect(bx + bw * 0.43, by, bw * 0.14, 1.5);
      // marker
      const mxp = bx + this.crackPos * bw;
      ctx.fillStyle = '#ffe66e';
      ctx.fillRect(mxp - 1, by - 4, 2, 20);
      ctx.beginPath(); ctx.moveTo(mxp, by - 5); ctx.lineTo(mxp - 4, by - 10); ctx.lineTo(mxp + 4, by - 10); ctx.closePath(); ctx.fill();
      if (!this.result)
        text(ctx, TouchUI.enabled ? 'TAP when the marker is centered!' : 'CLICK when the marker is centered!', cx, by + 22, { size: 7, color: '#ffe6b0', align: 'center' });
    } else if (this.mode === 'polish') {
      text(ctx, `Polishing: ${ITEMS[this.item].name}  (x${G.storage[this.item]})`, cx, this.WY + 28, { size: 8, color: '#f4e8cc', align: 'center' });
      // shine meter
      const bw = 180, bx = cx - bw / 2, by = this.WY + 162;
      rrect(ctx, bx - 2, by - 2, bw + 4, 12, '#181008', '#7e5c34');
      ctx.fillStyle = '#2c1f12';
      ctx.fillRect(bx, by, bw, 8);
      const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grad.addColorStop(0, '#8ff0d8'); grad.addColorStop(1, '#fffdf4');
      ctx.fillStyle = grad;
      ctx.fillRect(bx, by, bw * this.shine, 8);
      // rub sparkles
      for (const s of this.sparkles) {
        ctx.fillStyle = `rgba(255,255,240,${clamp(s.t * 2, 0, 1)})`;
        ctx.fillRect(s.x, s.y, 1.5, 1.5);
        ctx.fillRect(s.x - 1.5, s.y + 1.5, 1, 1);
      }
      // gleam sweep on the item as shine grows
      ctx.save();
      ctx.globalAlpha = this.shine * 0.5;
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 40 + this.shine * 60, cy - 30, 4, 60);
      ctx.restore();
      if (!this.result)
        text(ctx, TouchUI.enabled ? 'RUB it back and forth!' : 'Hold and RUB side to side!', cx, by + 18, { size: 7, color: '#ffe6b0', align: 'center' });
    }

    if (this.result) {
      const col = this.result.good === 2 ? '#a0f2b4' : (this.result.good === 1 ? '#ffe6b0' : '#e88a8a');
      text(ctx, this.result.msg, cx, this.WY + 62, { size: 11, color: col, align: 'center' });
    }
    text(ctx, '[Esc] back', this.WX + 12, this.WY + this.WH - 14, { size: 6, color: '#8a7758' });
  },
};

/* ===== js/main.js ===== */
// ---- input (keyboard + mouse + touch), game state, title, main loop ----------

let G = null;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const Input = {
  keys: {}, pressed: new Set(),
  mouse: { x: 240, y: 135, down: false, clicked: false, speed: 0, lastX: 240, lastY: 135, idleT: 9 },
  wheelDelta: 0,
  p(code) {
    if (this.pressed.has(code)) { this.pressed.delete(code); return true; }
    return false;
  },
  endFrame() { this.pressed.clear(); this.mouse.clicked = false; this.wheelDelta = 0; },
};

// The element that defines the space available to the canvas. When the game is
// embedded, a [data-fit] ancestor can own the sizing so the frame around the
// canvas is free to shrink-wrap it (its own width can't be the input, or the
// measurement would be circular). Optional --fit-inset accounts for that frame.
function fitHost() {
  return canvas.closest('[data-fit]') || canvas.parentElement;
}

function resize() {
  const host = fitHost();
  let availW = window.innerWidth, availH = window.innerHeight;
  if (host && host.clientWidth) {
    const inset = parseFloat(getComputedStyle(host).getPropertyValue('--fit-inset')) || 0;
    availW = host.clientWidth - inset;
    availH = host.clientHeight - inset;
  }
  // Snap to half-integer scales when upscaling: pixel art stays crisp, and the
  // shrink-wrapped frame means the leftover space costs nothing visually.
  const scaleRaw = Math.min(availW / W, availH / H);
  const scale = scaleRaw >= 1 ? Math.max(1, Math.floor(scaleRaw * 2) / 2) : Math.max(0.1, scaleRaw);
  canvas.style.width = `${W * scale}px`;
  canvas.style.height = `${H * scale}px`;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) {
  const host = fitHost();
  if (host) new ResizeObserver(resize).observe(host);
}

window.addEventListener('keydown', (e) => {
  SND.init(); SND.resume();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { Input.keys[e.code] = true; Input.pressed.add(e.code); }
});
window.addEventListener('keyup', (e) => { Input.keys[e.code] = false; });

function toCanvasXY(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: clamp((clientX - r.left) / r.width * W, 0, W),
    y: clamp((clientY - r.top) / r.height * H, 0, H),
  };
}
window.addEventListener('mousemove', (e) => {
  const p = toCanvasXY(e.clientX, e.clientY);
  Input.mouse.x = p.x; Input.mouse.y = p.y;
});
window.addEventListener('mousedown', (e) => {
  SND.init(); SND.resume();
  if (e.button === 0) { Input.mouse.down = true; Input.mouse.clicked = true; }
});
window.addEventListener('mouseup', (e) => { if (e.button === 0) Input.mouse.down = false; });
window.addEventListener('wheel', (e) => { Input.wheelDelta += Math.sign(e.deltaY); }, { passive: true });
window.addEventListener('contextmenu', (e) => e.preventDefault());

// ---- touch controls ------------------------------------------------------------
const TouchUI = {
  enabled: false,
  pointerId: null,
  held: new Map(),   // touch identifier -> button
  buttons: [],

  layout() {
    const b = [];
    if (!G || !Game.scene || Game.scene === TitleScene) return b;
    if (Game.helpOpen || Shop.open || Bench.open) return b;
    const sc = Game.scene;
    if (sc === WorldScene || sc === HouseScene) {
      b.push({ x: 8, y: H - 52, w: 44, h: 44, key: 'ArrowLeft', icon: 'left' });
      b.push({ x: 58, y: H - 52, w: 44, h: 44, key: 'ArrowRight', icon: 'right' });
      b.push({ x: W - 52, y: H - 52, w: 44, h: 44, tap: 'KeyE', icon: 'act' });
      b.push({ x: W - 26, y: 24, w: 20, h: 18, tap: 'KeyH', icon: 'help' });
    } else if (sc === DiveScene) {
      b.push({ x: W - 46, y: H - 122, w: 40, h: 40, key: 'KeyW', icon: 'up' });
      b.push({ x: W - 46, y: H - 76, w: 40, h: 40, key: 'KeyS', icon: 'down' });
    }
    return b;
  },

  // buttons are rebuilt every frame, so match by identity (icon), not reference
  isHeld(btn) {
    for (const v of this.held.values()) if (v.icon === btn.icon) return true;
    return false;
  },

  draw(c) {
    if (!this.enabled) return;
    for (const b of this.buttons) {
      const held = this.isHeld(b);
      if (b.icon === 'help') {
        uiPanel(c, b.x, b.y, b.w, b.h, held ? 0.98 : 0.6);
        text(c, '?', b.x + b.w / 2, b.y + 4, { size: 9, color: '#efe0bc', align: 'center' });
        continue;
      }
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2, r = b.w / 2 - 2;
      c.fillStyle = held ? 'rgba(240,220,170,0.4)' : 'rgba(14,20,28,0.5)';
      c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(230,200,150,0.55)'; c.lineWidth = 1;
      c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke();
      c.fillStyle = held ? '#1a1108' : '#efe0bc';
      if (b.icon === 'left' || b.icon === 'right') {
        const d = b.icon === 'right' ? 1 : -1;
        c.beginPath();
        c.moveTo(cx + 6 * d, cy); c.lineTo(cx - 4 * d, cy - 7); c.lineTo(cx - 4 * d, cy + 7);
        c.closePath(); c.fill();
      } else if (b.icon === 'up' || b.icon === 'down') {
        const d = b.icon === 'down' ? 1 : -1;
        c.beginPath();
        c.moveTo(cx, cy + 6 * d); c.lineTo(cx - 7, cy - 4 * d); c.lineTo(cx + 7, cy - 4 * d);
        c.closePath(); c.fill();
      } else if (b.icon === 'act') {
        // paw print
        c.beginPath(); c.ellipse(cx, cy + 3, 6, 4.5, 0, 0, TAU); c.fill();
        for (let i = -1; i <= 1; i++) {
          c.beginPath(); c.arc(cx + i * 5.5, cy - 4 + Math.abs(i) * 1.5, 2.2, 0, TAU); c.fill();
        }
      }
    }
  },
};

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  SND.init(); SND.resume();
  TouchUI.enabled = true;
  for (const t of e.changedTouches) {
    const p = toCanvasXY(t.clientX, t.clientY);
    const btn = TouchUI.buttons.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
    if (btn) {
      TouchUI.held.set(t.identifier, btn);
      if (btn.key) Input.keys[btn.key] = true;
      if (btn.tap) Input.pressed.add(btn.tap);
    } else if (TouchUI.pointerId === null) {
      TouchUI.pointerId = t.identifier;
      Input.mouse.x = p.x; Input.mouse.y = p.y;
      Input.mouse.lastX = p.x; Input.mouse.lastY = p.y;
      Input.mouse.down = true; Input.mouse.clicked = true;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === TouchUI.pointerId) {
      const p = toCanvasXY(t.clientX, t.clientY);
      Input.mouse.x = p.x; Input.mouse.y = p.y;
    }
  }
}, { passive: false });

function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const btn = TouchUI.held.get(t.identifier);
    if (btn) {
      TouchUI.held.delete(t.identifier);
      if (btn.key && !TouchUI.isHeld(btn)) Input.keys[btn.key] = false;   // isHeld matches by icon
    }
    if (t.identifier === TouchUI.pointerId) {
      TouchUI.pointerId = null;
      Input.mouse.down = false;
    }
  }
}
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });

// ---- game manager ---------------------------------------------------------------
const Game = {
  scene: null, fade: 1, fadeDir: -1, pending: null,
  toasts: [], time: 0, saveT: 25, helpOpen: false,
  rotHinted: false,

  go(scene, arg) {
    this.pending = { scene, arg };
    if (this.fadeDir !== 1) this.fadeDir = 1;
  },

  updateFade(dt) {
    if (this.fadeDir === 1) {
      this.fade += dt * 3;
      if (this.fade >= 1) {
        this.fade = 1;
        const p = this.pending; this.pending = null;
        Shop.open = false;        // scene changes always dismiss modals
        Bench.open = false;
        this.helpOpen = false;
        this.scene = p.scene;
        this.scene.enter(p.arg);
        this.fadeDir = -1;
      }
    } else if (this.fadeDir === -1) {
      this.fade -= dt * 3;
      if (this.fade <= 0) { this.fade = 0; this.fadeDir = 0; }
    }
  },

  toast(msg) {
    this.toasts.push({ msg, t: 4.5 });
    if (this.toasts.length > 4) this.toasts.shift();
  },

  hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  },
  save() {
    if (!G) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {}
  },
  load() {
    const base = defaultState();
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!d) { G = base; return; }
      G = Object.assign(base, d);
      for (const k of ['storage', 'gear', 'stats', 'flags', 'decor'])
        G[k] = Object.assign(defaultState()[k], d[k] || {});
      if (!Array.isArray(G.growth) || G.growth.length !== 3) G.growth = [1, 1, 1];
      if (!Array.isArray(G.seeds) || G.seeds.length !== 3) G.seeds = [11, 22, 33];
    } catch (e) { G = base; }
  },
  newGame() {
    G = defaultState();
    this.save();
  },

  // Shell beds only come back overnight — and only some of them. Each piling
  // rolls its own fortune; a lucky day is a bounty, a poor one sends you deeper.
  newDayRegrow(force) {
    if (!force && this.scene === DiveScene) { G.flags.pendingRegrow = true; return; }
    for (let i = 0; i < 3; i++) {
      G.growth[i] = clamp(rand(0.5, 0.78) + (Math.random() < 0.15 ? 0.22 : 0), 0, 1);
      G.seeds[i]++;
    }
    delete G.flags.pendingRegrow;
  },

  globalUpdate(dt) {
    this.time += dt;
    // day cycle: one full day = 5 real minutes
    G.clock += dt / 300;
    if (G.clock >= 1) {
      G.clock -= 1;
      G.day++;
      this.toast(`Day ${G.day} dawns.`);
      this.newDayRegrow(false);
      this.save();
    }
    // drone shipment
    if (G.pendingCrate) {
      G.pendingCrate.t -= dt;
      if (G.pendingCrate.t <= 0) {
        G.money += G.pendingCrate.value;
        G.stats.sold++;
        SND.cash();
        SND.droneOff();
        this.toast(`Drone pickup: +$${G.pendingCrate.value}!`);
        G.pendingCrate = null;
        this.save();
      }
    }
    // Otto's plan: advance the current goal when its condition is met
    if (G.goal < GOALS.length && GOAL_DONE[G.goal](G)) {
      const done = GOALS[G.goal];
      G.goal++;
      G.money += 25;
      SND.chime();
      this.toast(`Goal complete: ${done.name}!  (+$25)`);
      if (G.goal >= GOALS.length) this.toast('Otto is living the dream. You did it!');
      this.save();
    }
    // autosave
    this.saveT -= dt;
    if (this.saveT <= 0) { this.saveT = 25; this.save(); }
    // toasts
    for (const t of this.toasts) t.t -= dt;
    this.toasts = this.toasts.filter(t => t.t > 0);
  },

  drawHUD(c) {
    // left panel: hearts over coin purse
    const pw = Math.max(G.maxHearts * 9 + 12, 58);
    uiPanel(c, 4, 4, pw, 27, 0.8);
    for (let i = 0; i < G.maxHearts; i++) {
      const kind = G.hearts >= i + 1 ? 'full' : (G.hearts >= i + 0.5 ? 'half' : 'empty');
      drawHeart(c, 9 + i * 9, 8, kind);
    }
    drawSpr(c, SPR.coin, 8, 16.5);
    text(c, `${G.money}`, 18, 17, { size: 8, color: '#ffe66e' });
    // right panel: day + sun/moon dial
    uiPanel(c, W - 68, 4, 64, 18, 0.8);
    text(c, `Day ${G.day}`, W - 9, 9, { size: 8, color: '#efe0bc', align: 'right' });
    // dial: dot travels an arc across a tiny horizon
    const dx = W - 57, dy = 16, dr = 7;
    c.fillStyle = 'rgba(230,200,150,0.4)';
    c.fillRect(dx - dr, dy, dr * 2, PIX);
    const day = G.clock > 0.06 && G.clock < 0.66;
    const tt = day ? (G.clock - 0.06) / 0.6 : clamp((G.clock >= 0.66 ? G.clock - 0.66 : G.clock + 0.34) / 0.4, 0, 1);
    const a = Math.PI + tt * Math.PI;
    c.fillStyle = day ? '#ffe66e' : '#dfe4ee';
    c.fillRect(dx + Math.cos(a) * dr - 1, dy + Math.sin(a) * dr - 1, 2, 2);
    if (this.scene !== DiveScene && !TouchUI.enabled)
      text(c, '[H] help', W - 9, 24, { size: 6, color: 'rgba(220,230,240,0.55)', align: 'right' });
    // current goal banner: the plan, always in view
    const goalTxt = G.goal < GOALS.length ? GOALS[G.goal].name : 'Living the dream';
    const star = G.goal < GOALS.length ? '*' : '★';
    const gw = textWidth(c, `${star} ${goalTxt}`, 6.5) + 12;
    c.globalAlpha = 0.85;
    uiPanel(c, W / 2 - gw / 2, 4, gw, 12, 0.6);
    text(c, `${star} ${goalTxt}`, W / 2, 7, { size: 6.5, color: '#ffe6b0', align: 'center' });
    c.globalAlpha = 1;
  },

  drawToasts(c) {
    for (let i = 0; i < this.toasts.length; i++) {
      const t = this.toasts[this.toasts.length - 1 - i];
      const a = clamp(t.t, 0, 1);
      const y = H - 18 - i * 14;
      c.globalAlpha = a;
      const w = textWidth(c, t.msg, 7) + 14;
      uiPanel(c, W / 2 - w / 2, y - 3, w, 13, 0.9);
      text(c, t.msg, W / 2, y, { size: 7, color: '#f4e8cc', align: 'center' });
      c.globalAlpha = 1;
    }
  },

  drawHelp(c) {
    c.fillStyle = 'rgba(4,7,11,0.8)';
    c.fillRect(0, 0, W, H);
    uiPanel(c, 52, 20, W - 104, H - 40, 0.97);
    text(c, "~ OTTO'S FIELD GUIDE ~", W / 2, 30, { size: 11, color: '#ffe6b0', align: 'center' });
    const touch = TouchUI.enabled;
    const lines = touch ? [
      ['ON THE SURFACE', '#5ad2f0'],
      ['  Arrow buttons walk. The paw button interacts.', '#d8ccb4'],
      ['  Laptop sells (drone pays on pickup). Workbench', '#d8ccb4'],
      ['  cracks shells & polishes treasures -- worth more!', '#d8ccb4'],
      ['  Sleep to heal. Beds regrow overnight... partly.', '#d8ccb4'],
      ['UNDER THE SEA', '#5ad2f0'],
      ['  Scrape crust off a shell, then HOLD to pry --', '#d8ccb4'],
      ['  let go in the green! No button gets you home:', '#d8ccb4'],
      ['  SWIM UP before your O2 runs out.', '#ffe6b0'],
      ['  Urchins sting, jellyfish numb, eels lunge from dens,', '#d8ccb4'],
      ['  a red "!" is a barracuda -- lift your paw!', '#d8ccb4'],
      ['  If the water goes quiet... DON\'T. MOVE.', '#e8434c'],
      ['  Tap anywhere to close this guide.', '#8a9484'],
    ] : [
      ['ON THE SURFACE', '#5ad2f0'],
      ['  A/D or arrows ... walk        E ... interact', '#d8ccb4'],
      ['  Laptop sells (drone pays on pickup). Workbench', '#d8ccb4'],
      ['  cracks shells & polishes treasures -- worth more!', '#d8ccb4'],
      ['  Sleep to heal. Beds regrow overnight... partly.', '#d8ccb4'],
      ['UNDER THE SEA', '#5ad2f0'],
      ['  Scrape crust (hold LMB), then HOLD on the shell to', '#d8ccb4'],
      ['  pry -- release in the green! W/S ... swim.', '#d8ccb4'],
      ['  No surface button: SWIM UP before O2 runs out.', '#ffe6b0'],
      ['  Urchins sting, jellyfish numb, eels lunge from dens,', '#d8ccb4'],
      ['  a red "!" is a barracuda -- move your paw!', '#d8ccb4'],
      ['  If the water goes quiet... DON\'T. MOVE.', '#e8434c'],

    ];
    let y = 46;
    for (const [ln, col] of lines) {

    }
    // the plan, right in the guide

      : `  All ${GOALS.length} goals complete. Otto is living the dream!`,

  drawCursor(c) {
    const m = Input.mouse;
    if (TouchUI.enabled) return;

    if (custom) return; // dive scene draws its own scraper-paw
    if (m.idleT > 3 && !Shop.open && this.scene !== TitleScene && !this.helpOpen) return;
    c.save();
    c.translate(Math.round(m.x), Math.round(m.y));
    c.fillStyle = '#101820';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 11); c.lineTo(3, 8); c.lineTo(7, 8); c.closePath(); c.fill();
    c.fillStyle = '#f2f4f6';
    c.beginPath(); c.moveTo(1, 2); c.lineTo(1, 8.5); c.lineTo(2.8, 7); c.lineTo(5, 7); c.closePath(); c.fill();
    c.restore();

};

// ---- main loop -------------------------------------------------------------------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000) || 0.016;
  lastT = now;

  // mouse speed (used by the shark's stare)
  const m = Input.mouse;
  const dist = Math.hypot(m.x - m.lastX, m.y - m.lastY);
  m.speed = lerp(m.speed, dist / Math.max(dt, 0.001), 0.5);
  m.lastX = m.x; m.lastY = m.y;
  m.idleT = dist > 0.5 ? 0 : m.idleT + dt;

  // touch button layout must exist before events land between frames
  TouchUI.buttons = TouchUI.layout();

  // global keys
  if (Input.p('KeyM')) {
    const muted = SND.toggleMute();
    Game.toast(muted ? 'Sound muted.' : 'Sound on.');
  }
  if (G && Game.scene !== TitleScene && !Shop.open && !Bench.open && Input.p('KeyH'))
    Game.helpOpen = !Game.helpOpen;

  // one-time landscape hint on phones
  if (TouchUI.enabled && !Game.rotHinted && window.innerHeight > window.innerWidth) {
    Game.rotHinted = true;
    Game.toast('Tip: rotate your phone for a bigger view!');
  }

  // updates
  if (Game.fadeDir === 0) {
    if (Game.helpOpen) {
      if (Input.p('Escape') || Input.mouse.clicked) Game.helpOpen = false;
    } else if (Shop.open) {
      Shop.update(dt);
    } else if (Bench.open) {
      Bench.update(dt);
    } else if (Game.scene) {
      Game.scene.update(dt);
    }
  }
  if (G && Game.scene !== TitleScene) Game.globalUpdate(dt);
  Game.updateFade(dt);
  SND.update(G ? G.musicOn : true);

  // draw — everything in logical 480x270 units at DPX texel density
  ctx.save();
  ctx.scale(DPX, DPX);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (Game.scene) Game.scene.draw(ctx);
  if (Shop.open) Shop.draw(ctx);
  if (Bench.open) Bench.draw(ctx);
  if (G && Game.scene !== TitleScene) Game.drawHUD(ctx);
  TouchUI.draw(ctx);
  Game.drawToasts(ctx);
  if (Game.helpOpen) Game.drawHelp(ctx);
  if (Game.fade > 0) {
    ctx.fillStyle = `rgba(0,0,0,${clamp(Game.fade, 0, 1)})`;
    ctx.fillRect(0, 0, W, H);
  }
  Game.drawCursor(ctx);
  ctx.restore();

  Input.endFrame();
  requestAnimationFrame(frame);
}

resize();
Game.scene = TitleScene;
TitleScene.enter();
requestAnimationFrame(frame);

</script>
