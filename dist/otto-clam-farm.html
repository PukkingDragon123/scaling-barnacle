/* ===== js/util.js ===== */
// ---- shared helpers ----------------------------------------------------

const W = 480, H = 270;   // logical resolution: all game code works in these units
const DPX = 2;            // art density: device texels per logical unit
const PIX = 1 / DPX;      // one device texel, in logical units (for fine detail)
const TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

function rand(a = 1, b) { return b === undefined ? Math.random() * a : a + Math.random() * (b - a); }
function irand(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

// deterministic RNG for node layouts
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function weightedPick(pairs, r) {
  // pairs: [[value, weight], ...], r in [0,1)
  let total = 0;
  for (const p of pairs) total += Math.max(0, p[1]);
  if (total <= 0) return pairs[0][0];
  let x = r * total;
  for (const p of pairs) {
    x -= Math.max(0, p[1]);
    if (x <= 0) return p[0];
  }
  return pairs[pairs.length - 1][0];
}

function text(ctx, str, x, y, opts = {}) {
  const { size = 8, color = '#fff', align = 'left', shadow = true, bold = true } = opts;
  ctx.font = `${bold ? 'bold ' : ''}${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  if (shadow) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillText(str, x + 1, y + 1);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function textWidth(ctx, str, size = 8, bold = true) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px "Courier New", monospace`;
  return ctx.measureText(str).width;
}

function rrect(ctx, x, y, w, h, fill, stroke) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }
}

// ---- hi-density pixel-art helpers ----------------------------------------

function hexRGB(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgbLerp(a, b, t) {
  return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))];
}
function cssRGB(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

// Vertical gradient rendered as flat pixel-art bands with dithered seams —
// reads as hand-placed color, not a smooth CSS gradient.
function bandedFill(ctx, x, y, w, h, from, to, bands = 10, dither = true) {
  const bh = h / bands;
  for (let i = 0; i < bands; i++) {
    const col = rgbLerp(from, to, i / Math.max(1, bands - 1));
    const by = y + bh * i;
    ctx.fillStyle = cssRGB(col);
    ctx.fillRect(x, by, w, bh + 0.6);
    if (dither && i > 0) {
      ctx.fillStyle = cssRGB(rgbLerp(from, to, (i - 1) / Math.max(1, bands - 1)));
      const step = 2;
      for (let dx = (i % 2), c = 0; dx < w; dx += step, c++)
        ctx.fillRect(x + dx, by, 1, 1);
    }
  }
}

// Draw a sprite authored at DPX density at its logical size, snapped to the
// device-texel grid so it stays crisp.
function drawSpr(ctx, img, x, y) {
  ctx.drawImage(img, Math.round(x * DPX) / DPX, Math.round(y * DPX) / DPX, img.width / DPX, img.height / DPX);
}

// Driftwood UI panel with pegged corners — the game's shared chrome.
function uiPanel(ctx, x, y, w, h, alpha = 0.88) {
  ctx.fillStyle = `rgba(26,17,10,${alpha})`;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(126,92,52,0.95)';
  ctx.fillRect(x, y, w, PIX * 2); ctx.fillRect(x, y + h - PIX * 2, w, PIX * 2);
  ctx.fillRect(x, y, PIX * 2, h); ctx.fillRect(x + w - PIX * 2, y, PIX * 2, h);
  ctx.fillStyle = 'rgba(230,200,150,0.35)';
  ctx.fillRect(x + 1, y + 1, w - 2, PIX);
  ctx.fillStyle = '#c8a03c';
  ctx.fillRect(x + 1.5, y + 1.5, 1, 1);
  ctx.fillRect(x + w - 2.5, y + 1.5, 1, 1);
  ctx.fillRect(x + 1.5, y + h - 2.5, 1, 1);
  ctx.fillRect(x + w - 2.5, y + h - 2.5, 1, 1);
}

// small pixel heart used by the HUD — authored at device density (14x12 texels
// drawn into a 7x6 logical footprint) with outline + shine
function drawHeart(ctx, x, y, kind) {
  // kind: 'full' | 'half' | 'empty'
  const rows = [
    '..ooo...ooo...',
    '.orrro.orrro..',
    'orrhrrorrrrro.',
    'orhrrrrrrrrro.',
    'orrrrrrrrrrro.',
    '.orrrrrrrrro..',
    '..orrrrrrro...',
    '...orrrrro....',
    '....orrro.....',
    '.....oro......',
    '......o.......',
  ];
  const pal = kind === 'empty'
    ? { o: '#1d1016', r: '#3a2330', h: '#4a2f3e' }
    : { o: '#341016', r: '#e8434c', h: '#ff9aa0' };
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const ch = rows[r][c];
      if (ch === '.') continue;
      let col = pal[ch];
      if (kind === 'half' && c > 6) col = { o: '#1d1016', r: '#3a2330', h: '#4a2f3e' }[ch];
      ctx.fillStyle = col;
      ctx.fillRect(x + c * PIX, y + r * PIX, PIX, PIX);
    }
  }
}

/* ===== js/audio.js ===== */
// ---- synthesized audio: sfx + generative music ---------------------------

const PENTA = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];

const SND = {
  ctx: null, master: null, ready: false, muted: false,
  scene: 'title',           // title | surface | house | dive | shark
  nextPluck: 0, nextBass: 0, nextBeat: 0, nextBubble: 0,
  heartRate: 0.9,
  pad: null,                // { oscs, gain, filter, gloom }
  droneHum: null,

  init() {
    if (this.ready) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      // feedback delay for dreamy space
      this.delay = this.ctx.createDelay(1.0);
      this.delay.delayTime.value = 0.29;
      this.delayGain = this.ctx.createGain();
      this.delayGain.gain.value = 0.3;
      this.delay.connect(this.delayGain);
      this.delayGain.connect(this.delay);
      this.delayGain.connect(this.master);
      // shared noise buffer
      const len = this.ctx.sampleRate;
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.ready = true;
    } catch (e) { /* audio unavailable; game still playable */ }
  },

  resume() { if (this.ready && this.ctx.state === 'suspended') this.ctx.resume(); },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    return this.muted;
  },

  tone(o = {}) {
    if (!this.ready || this.muted) return;
    const { f = 440, f2 = 0, type = 'sine', a = 0.005, d = 0.2, v = 0.25, t = 0, fx = false } = o;
    const c = this.ctx, t0 = c.currentTime + t;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, f), t0);
    if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(v, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    osc.connect(g); g.connect(this.master);
    if (fx) g.connect(this.delay);
    osc.start(t0); osc.stop(t0 + a + d + 0.1);
  },

  noise(o = {}) {
    if (!this.ready || this.muted) return;
    const { d = 0.15, v = 0.25, f = 1200, f2 = 0, q = 1.2, t = 0 } = o;
    const c = this.ctx, t0 = c.currentTime + t;
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    src.playbackRate.value = rand(0.85, 1.15);
    const flt = c.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.setValueAtTime(f, t0); flt.Q.value = q;
    if (f2) flt.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t0 + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + d + 0.1);
  },

  // ---- sfx ---------------------------------------------------------------
  click()  { this.tone({ f: 660, type: 'square', d: 0.05, v: 0.1 }); },
  blip()   { this.tone({ f: 880, type: 'square', d: 0.04, v: 0.08 }); },
  pop(p = 1) {
    this.noise({ f: 2400, d: 0.05, v: 0.2 });
    this.tone({ f: 260 * p, f2: 80, type: 'triangle', d: 0.12, v: 0.35 });
    this.tone({ f: 520 * p, f2: 200, type: 'sine', d: 0.08, v: 0.15, t: 0.01 });
  },
  scrape() { this.noise({ f: rand(700, 1600), f2: rand(400, 900), d: 0.07, v: 0.12, q: 2.5 }); },
  clink()  { this.tone({ f: rand(1800, 2400), type: 'square', d: 0.03, v: 0.05 }); },
  splash() { this.noise({ f: 900, f2: 250, d: 0.45, v: 0.35, q: 0.8 }); },
  bubble() { this.tone({ f: rand(300, 500), f2: rand(700, 1100), type: 'sine', d: 0.12, v: 0.05 }); },
  chime()  {
    [880, 1320, 1760, 2200].forEach((f, i) =>
      this.tone({ f, type: 'sine', d: 0.5, v: 0.14, t: i * 0.09, fx: true }));
  },
  cash() {
    this.tone({ f: 1150, type: 'square', d: 0.06, v: 0.12 });
    this.tone({ f: 1540, type: 'square', d: 0.1, v: 0.12, t: 0.07 });
  },
  hurt() {
    this.tone({ f: 220, f2: 60, type: 'sawtooth', d: 0.25, v: 0.3 });
    this.noise({ f: 400, f2: 120, d: 0.2, v: 0.25 });
  },
  bite() {
    this.noise({ f: 300, f2: 80, d: 0.25, v: 0.5, q: 0.7 });
    this.tone({ f: 90, f2: 35, type: 'sawtooth', d: 0.35, v: 0.5 });
  },
  warn()   { this.tone({ f: 980, type: 'square', d: 0.07, v: 0.15 }); this.tone({ f: 980, type: 'square', d: 0.07, v: 0.15, t: 0.12 }); },
  alarm()  { this.tone({ f: 700, f2: 500, type: 'square', d: 0.15, v: 0.1 }); },
  gull()   { this.tone({ f: rand(1100, 1400), f2: 800, type: 'sine', d: 0.25, v: 0.06 }); this.tone({ f: rand(1200, 1500), f2: 850, type: 'sine', d: 0.2, v: 0.05, t: 0.22 }); },
  whale()  { this.tone({ f: 65, f2: 110, type: 'sine', d: 2.8, v: 0.14, fx: true }); },
  relief() { [392, 494, 587].forEach((f, i) => this.tone({ f, type: 'triangle', d: 0.7, v: 0.1, t: i * 0.12, fx: true })); },
  thump(v = 0.5) {
    this.tone({ f: 58, f2: 36, type: 'sine', d: 0.12, v });
    this.tone({ f: 52, f2: 34, type: 'sine', d: 0.1, v: v * 0.6, t: 0.16 });
  },
  sleepy() { [523, 392, 329, 261].forEach((f, i) => this.tone({ f, type: 'triangle', d: 0.6, v: 0.09, t: i * 0.16, fx: true })); },
  pryCreak() {
    this.tone({ f: 140, f2: 220, type: 'sawtooth', d: 0.3, v: 0.08 });
    this.noise({ f: 350, f2: 600, d: 0.25, v: 0.08, q: 3 });
  },
  clank() {
    this.tone({ f: 320, f2: 120, type: 'square', d: 0.12, v: 0.2 });
    this.noise({ f: 800, f2: 300, d: 0.1, v: 0.18 });
  },
  ding() { this.tone({ f: 990, type: 'triangle', d: 0.3, v: 0.14, fx: true }); this.tone({ f: 1480, type: 'sine', d: 0.25, v: 0.08, t: 0.05, fx: true }); },
  zap() {
    this.tone({ f: 620, f2: 180, type: 'sawtooth', d: 0.18, v: 0.2 });
    this.noise({ f: 2400, f2: 900, d: 0.15, v: 0.15, q: 4 });
  },
  crackHit(perfect) {
    this.noise({ f: 1800, f2: 500, d: 0.08, v: 0.3 });
    this.tone({ f: perfect ? 520 : 300, f2: 120, type: 'triangle', d: 0.14, v: 0.3 });
    if (perfect) this.tone({ f: 1040, type: 'sine', d: 0.3, v: 0.1, t: 0.06, fx: true });
  },
  smash() {
    this.noise({ f: 500, f2: 120, d: 0.3, v: 0.35, q: 0.8 });
    this.tone({ f: 140, f2: 50, type: 'sawtooth', d: 0.25, v: 0.25 });
  },
  rub() { this.noise({ f: rand(2000, 3200), f2: rand(1200, 1800), d: 0.09, v: 0.05, q: 2.5 }); },

  droneOn() {
    if (!this.ready || this.droneHum || this.muted) return;
    const c = this.ctx;
    const o1 = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = 92;
    o2.type = 'sawtooth'; o2.frequency.value = 187;
    g.gain.value = 0.028;
    o1.connect(g); o2.connect(g); g.connect(this.master);
    o1.start(); o2.start();
    this.droneHum = { o1, o2, g };
  },
  droneOff() {
    if (!this.droneHum) return;
    const { o1, o2, g } = this.droneHum;
    try { g.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.1); o1.stop(this.ctx.currentTime + 0.4); o2.stop(this.ctx.currentTime + 0.4); } catch (e) {}
    this.droneHum = null;
  },

  // ---- underwater pad ------------------------------------------------------
  padOn(gloomy) {
    if (!this.ready) return;
    this.padOff();
    const c = this.ctx;
    const g = c.createGain(); g.gain.value = 0;
    const flt = c.createBiquadFilter(); flt.type = 'lowpass';
    flt.frequency.value = gloomy ? 160 : 320;
    const oscs = [];
    const fs = gloomy ? [55, 58.3, 41] : [55, 55.4, 82.5];
    for (const f of fs) {
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f;
      o.connect(flt); o.start(); oscs.push(o);
    }
    flt.connect(g); g.connect(this.master);
    g.gain.setTargetAtTime(gloomy ? 0.09 : 0.05, c.currentTime, 0.8);
    this.pad = { oscs, gain: g, filter: flt, gloom: !!gloomy };
  },
  padOff() {
    if (!this.pad) return;
    const p = this.pad, c = this.ctx;
    try {
      p.gain.gain.setTargetAtTime(0.0001, c.currentTime, 0.4);
      p.oscs.forEach(o => o.stop(c.currentTime + 1.6));
    } catch (e) {}
    this.pad = null;
  },

  setScene(s) {
    if (s === this.scene) return;
    const prev = this.scene;
    this.scene = s;
    if (!this.ready) return;
    if (s === 'dive') this.padOn(false);
    else if (s === 'shark') { this.padOn(true); this.heartRate = 1.0; this.nextBeat = this.ctx.currentTime + 0.2; }
    else if (prev === 'dive' || prev === 'shark') this.padOff();
  },

  update(musicOn) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime;
    if ((this.scene === 'surface' || this.scene === 'house' || this.scene === 'title') && musicOn) {
      if (t > this.nextPluck) {
        this.nextPluck = t + pick([0.28, 0.42, 0.56, 0.56, 0.84, 1.12]);
        if (Math.random() < 0.72)
          this.tone({ f: pick(PENTA), type: 'triangle', a: 0.01, d: 0.7, v: 0.07, fx: true });
      }
      if (t > this.nextBass) {
        this.nextBass = t + 3.36;
        this.tone({ f: pick([110, 98, 82.4, 130.8]), type: 'sine', a: 0.05, d: 2.4, v: 0.06 });
      }
    } else if (this.scene === 'dive') {
      if (t > this.nextBubble) {
        this.nextBubble = t + rand(1.5, 5);
        this.bubble();
      }
    } else if (this.scene === 'shark') {
      if (t > this.nextBeat) {
        this.nextBeat = t + this.heartRate;
        this.thump(0.55);
        this.heartRate = Math.max(0.45, this.heartRate - 0.03);
      }
    }
  },
};

// ---- pixel sprites (authored as char grids at DPX density) ------------------
// Sprites are drawn at 2x texel density and rendered at half size via drawSpr,
// so a 32-wide grid occupies 16 logical px with twice the hand-placed detail.

function makeSprite(rows, pal) {
  const h = rows.length;
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const col = pal[row[x]];
      if (!col) continue;
      c.fillStyle = col;
      c.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

function flipSprite(img) {
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const c = cv.getContext('2d');
  c.translate(img.width, 0); c.scale(-1, 1);
  c.drawImage(img, 0, 0);
  return cv;
}

// chunky pixel clouds — flat bottoms, sunlit tops
function makeCloud(len, tall) {
  const cv = document.createElement('canvas');
  cv.width = len; cv.height = tall;
  const c = cv.getContext('2d');
  const rng = mulberry32(len * 31 + tall * 7);
  const lobes = 3 + Math.floor(rng() * 3);
  c.fillStyle = '#f6f9fb';
  for (let i = 0; i < lobes; i++) {
    const r = tall * (0.32 + rng() * 0.26);
    const lx = clamp(8 + (len - 20) * (i / (lobes - 1)), r + 1, len - r - 1);
    c.beginPath(); c.arc(lx, tall - r * 0.75, r, 0, TAU); c.fill();
  }
  c.fillRect(4, tall - tall * 0.4, len - 8, tall * 0.4 - 1);
  // shaded underside
  c.fillStyle = '#c9d8e2';
  c.fillRect(4, tall - 3, len - 8, 2);
  c.fillRect(8, tall - 5, len - 20, 2);
  return cv;
}

// Draw Otto anchored at his feet with squash & stretch — the bounce lives here.
// sqx/sqy scale about the ground point; lift hops him off it.
function drawOtto(ctx, img, cx, feetY, sqx = 1, sqy = 1, lift = 0) {
  const w = img.width / DPX, h = img.height / DPX;
  ctx.save();
  ctx.translate(Math.round(cx * DPX) / DPX, feetY - lift);
  ctx.scale(sqx, sqy);
  ctx.drawImage(img, -w / 2, -h + 1, w, h);
  ctx.restore();
}

// ---- procedural drone (finer texels via PIX) -----------------------------------
function drawDrone(ctx, x, y, t, hasCrate) {
  ctx.save();
  ctx.translate(Math.round(x * DPX) / DPX, Math.round(y * DPX) / DPX);
  // body
  ctx.fillStyle = '#242a32';
  ctx.fillRect(-7, -2, 14, 5);
  ctx.fillStyle = '#3d4854';
  ctx.fillRect(-5.5, -3, 11, 2);
  ctx.fillStyle = '#57646f';
  ctx.fillRect(-5.5, -3, 11, PIX);
  // eye/light
  ctx.fillStyle = '#5ad2f0';
  ctx.fillRect(-2, 0, 4, 1.5);
  ctx.fillStyle = '#bfeffb';
  ctx.fillRect(-1.5, 0, 1, PIX * 2);
  // blinking nav light
  if (Math.sin(t * 6) > 0.2) {
    ctx.fillStyle = '#ff5a4a';
    ctx.fillRect(5.5, -1, 1, 1);
  }
  // arms
  ctx.fillStyle = '#181c22';
  ctx.fillRect(-12, -2, 5, 1);
  ctx.fillRect(7, -2, 5, 1);
  // rotor shimmer
  const rw = 5 + Math.sin(t * 40) * 2;
  ctx.fillStyle = 'rgba(210,225,235,0.85)';
  ctx.fillRect(-11 - rw / 2, -4, rw, PIX * 2);
  ctx.fillRect(11 - rw / 2, -4, rw, PIX * 2);
  if (hasCrate) {
    ctx.strokeStyle = '#8a94a0'; ctx.lineWidth = PIX;
    ctx.beginPath(); ctx.moveTo(-4, 3); ctx.lineTo(-3, 7); ctx.moveTo(4, 3); ctx.lineTo(3, 7); ctx.stroke();
    drawCrate(ctx, -5, 7, 10);
  }
  ctx.restore();
}

function drawCrate(ctx, x, y, s = 12) {
  const h = s * 0.8;
  ctx.fillStyle = '#8a6434';
  ctx.fillRect(x, y, s, h);
  // plank lines
  ctx.fillStyle = '#755428';
  ctx.fillRect(x, y + h * 0.33, s, PIX);
  ctx.fillRect(x, y + h * 0.66, s, PIX);
  // frame
  ctx.fillStyle = '#5f4322';
  ctx.fillRect(x, y, s, 1.5);
  ctx.fillRect(x, y + h - 1.5, s, 1.5);
  ctx.fillRect(x, y, 1.5, h);
  ctx.fillRect(x + s - 1.5, y, 1.5, h);
  // diagonal brace + nails
  ctx.strokeStyle = '#5f4322'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 1.5, y + 1.5); ctx.lineTo(x + s - 1.5, y + h - 1.5); ctx.stroke();
  ctx.fillStyle = '#c8a03c';
  ctx.fillRect(x + 1, y + 1, PIX, PIX);
  ctx.fillRect(x + s - 1.5, y + 1, PIX, PIX);
  ctx.fillRect(x + 1, y + h - 1.5, PIX, PIX);
  ctx.fillRect(x + s - 1.5, y + h - 1.5, PIX, PIX);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x + 1.5, y + h - 1, s - 3, PIX);
  // top highlight
  ctx.fillStyle = 'rgba(240,220,170,0.35)';
  ctx.fillRect(x + 1.5, y + PIX, s - 3, PIX);
}

// ---- DIVE MODE: first-person scraping minigame ----------------------------

const DiveScene = {
  customCursor: true,
  WALL_X: 150, WALL_W: 180,

  p: 0, nodes: [], totalHarv: 1,
  camY: 0, maxCam: 0, camVel: 0,
  air: 0, airMax: 0, airBeepT: 0,
  bag: {}, bagCount: 0, bagPulse: 0,
  particles: [], floaters: [], flyIcons: [], fish: [], snow: [], bubbles: [],
  combo: 0, comboT: 0, scrapeT: 0,
  barra: null,
  shark: null, sharkCooldown: 45, sharkRollT: 1,
  whaleT: 25,
  gloom: 0, gloomTarget: 0,
  shakeT: 0, flash: 0, flashCol: '232,60,60', slowT: 0,
  msg: '', msgT: 0, banner: '', bannerT: 0,
  time: 0, wallCanvas: null,
  over: false, overT: 0,

  enter(p) {
    this.p = p;
    this.time = 0;
    this.camY = 0; this.camVel = 0;
    this.maxCam = PILINGS[p].depth - H + 40;
    this.airMax = TANKS[G.gear.tank].air;
    this.air = this.airMax;
    this.airBeepT = 0;
    this.bag = {}; this.bagCount = 0; this.bagPulse = 0;
    this.particles = []; this.floaters = []; this.flyIcons = []; this.bubbles = [];
    this.combo = 0; this.comboT = 0; this.scrapeT = 0;
    this.msg = ''; this.msgT = 0; this.banner = ''; this.bannerT = 0;
    this.shakeT = 0; this.flash = 0; this.slowT = 0;
    this.over = false; this.overT = 0;
    this.gloom = 0; this.gloomTarget = 0;
    this.shark = null;
    this.sharkCooldown = rand(40, 70);
    this.sharkRollT = 1;
    this.whaleT = rand(20, 50);
    this.barra = { state: 'idle', t: rand(8, 16), y: 0, x: 0, dir: 1, hit: false };
    this.pry = null;          // active pry minigame { n, t, speed, win, marker }
    this.numbT = 0;           // jellyfish sting lockout
    this.surfaceT = 0;        // held-up-at-top timer
    this.nodes = this.gen(p);
    this.buildWall();
    // jellyfish drift up through the water column
    this.jellies = [];
    const jcount = 2 + (p >= 1 ? 1 : 0) + (p >= 2 ? 1 : 0);
    for (let i = 0; i < jcount; i++) {
      this.jellies.push({
        x: Math.random() < 0.6 ? (Math.random() < 0.5 ? rand(20, this.WALL_X - 20) : rand(this.WALL_X + this.WALL_W + 20, W - 20)) : rand(this.WALL_X, this.WALL_X + this.WALL_W),
        wy: rand(120, PILINGS[p].depth), vy: rand(6, 13), sway: rand(TAU), r: rand(8, 13), cd: 0,
      });
    }
    // schools of little fish weaving behind the piling
    this.schools = [];
    for (let s = 0; s < 2; s++) {
      const members = [];
      const count = irand(5, 8);
      for (let i = 0; i < count; i++) members.push({ ox: -i * 7 - rand(0, 4), oy: rand(-8, 8), ph: rand(TAU) });
      this.schools.push({ x: rand(0, W), y: rand(40, H - 40), dir: Math.random() < 0.5 ? 1 : -1, speed: rand(22, 34), ph: rand(TAU), members, flee: false });
    }
    // night plankton
    this.plankton = [];
    for (let i = 0; i < 26; i++) this.plankton.push({ x: rand(W), y: rand(H), v: rand(2, 6), ph: rand(TAU) });
    // ambient fish
    this.fish = [];
    for (let i = 0; i < 9; i++) {
      const left = Math.random() < 0.5;
      this.fish.push({
        x: left ? rand(0, this.WALL_X - 10) : rand(this.WALL_X + this.WALL_W + 10, W),
        y: rand(20, H - 20), vx: rand(6, 18) * (Math.random() < 0.5 ? 1 : -1),
        size: rand(3, 6), phase: rand(TAU), flee: false, alpha: 1, side: left ? 0 : 1,
      });
    }
    this.snow = [];
    for (let i = 0; i < 40; i++) this.snow.push({ x: rand(W), y: rand(H), v: rand(3, 9), drift: rand(TAU) });

  // ---- node generation: sparse, big, staged ----------------------------------
  gen(p) {
    const def = PILINGS[p];
    const rng = mulberry32(G.seeds[p] * 7919 + p * 101 + 13);
    const nodes = [];
    const rows = Math.floor((def.depth - 110) / 56);
    for (let r = 0; r < rows; r++) {
      const d = r / rows;
      const count = rng() < 0.35 ? 2 : 1;
      for (let i = 0; i < count; i++) {
        const kind = weightedPick([
          ['clam', 5 - 2.5 * d],
          ['mussel', 1.2 + 1.5 * d],
          ['barnacle', 2.2],
          ['oyster', (p >= 1) ? 0.5 + 2.2 * d : (d > 0.55 ? 0.7 : 0)],
          ['abalone', (p >= 2 && d > 0.45) ? 2.2 * d : 0],
          ['urchin', 0.4 + 1.5 * d + 0.3 * p],
        ], rng());
        const nd = NODE_DEFS[kind];
        nodes.push({
          x: this.WALL_X + 28 + rng() * (this.WALL_W - 56) + (count === 2 ? (i === 0 ? -34 : 34) : 0),
          y: 84 + r * 56 + rng() * 24,
          kind, r: nd.r * (0.9 + rng() * 0.25),
          hp: Math.max(1, nd.crust), maxHp: Math.max(1, nd.crust),
          stage: nd.crust > 0 ? 'crusted' : 'exposed',
          seed: Math.floor(rng() * 99999), alive: true, shake: 0, phase: rng() * TAU, clampT: 0,
        });
      }
      // living decoration: starfish + anemones make the wall feel inhabited
      if (rng() < 0.45) {
        nodes.push({
          kind: 'star', decor: true, alive: true,
          x: this.WALL_X + 18 + rng() * (this.WALL_W - 36), y: 84 + r * 56 + rng() * 40,
          r: 5.5 + rng() * 3.5, seed: Math.floor(rng() * 99999), phase: rng() * TAU,
        });
      }
      if (rng() < 0.3) {
        nodes.push({
          kind: 'anemone', decor: true, alive: true,
          x: rng() < 0.5 ? this.WALL_X + 8 + rng() * 10 : this.WALL_X + this.WALL_W - 18 + rng() * 10,
          y: 84 + r * 56 + rng() * 40,
          r: 5 + rng() * 3, seed: Math.floor(rng() * 99999), phase: rng() * TAU,
        });
      }
    }
    // moray eel dens, deeper half only
    for (let y = def.depth * 0.35; y < def.depth - 100; y += 300 + rng() * 160) {
      nodes.push({
        kind: 'eelhole', decor: true, alive: true,
        x: this.WALL_X + 34 + rng() * (this.WALL_W - 68), y: y + rng() * 60,
        r: 12, seed: Math.floor(rng() * 99999), phase: rng() * TAU,
        eel: { state: 'hidden', t: 3 + rng() * 5 },
      });
    }
    // regrowth: shallow slots are the least likely to have come back — the good
    // beds are always a little deeper than you'd like
    const harv = nodes.filter(n => !n.decor && n.kind !== 'urchin');
    const scored = harv.map(n => ({ n, s: rng() * (0.55 + 0.9 * (n.y / def.depth)) }));
    scored.sort((a, b) => a.s - b.s);
    const dead = Math.round((1 - clamp(G.growth[p], 0, 1)) * scored.length);
    for (let i = 0; i < dead; i++) scored[i].n.alive = false;
    this.totalHarv = Math.max(1, scored.length);
    return nodes;
  },

  buildWall() {
    const depth = PILINGS[this.p].depth;
    const cwL = this.WALL_W + 24;   // logical width; canvas is DPX-dense
    const cv = document.createElement('canvas');
    cv.width = cwL * DPX; cv.height = depth * DPX;
    const c = cv.getContext('2d');
    c.scale(DPX, DPX);
    const rng = mulberry32(G.seeds[this.p] * 31 + 7);
    // wood base with per-plank tones (grain runs vertically on a piling)
    c.fillStyle = '#42311f';
    c.fillRect(0, 0, cwL, depth);
    for (let x = 12; x < cwL - 12; x += 34) {
      c.fillStyle = ['#453322', '#3d2d1c', '#48361f'][Math.floor(rng() * 3)];
      c.fillRect(x + 2, 0, 32, depth);
      c.fillStyle = '#2c1f10';
      c.fillRect(x, 0, 2, depth);
    }
    // long vertical grain streaks
    for (let i = 0; i < depth * 1.2; i++) {
      c.fillStyle = rng() < 0.5 ? 'rgba(96,72,44,0.45)' : 'rgba(40,28,16,0.45)';
      c.fillRect(12 + rng() * (cwL - 24), rng() * depth, PIX, 3 + rng() * 14);
    }
    // knots with check-cracks below
    for (let i = 0; i < depth / 30; i++) {
      const kx = 18 + rng() * (cwL - 36), ky = rng() * depth;
      c.strokeStyle = 'rgba(26,18,10,0.8)'; c.lineWidth = PIX * 2;
      c.beginPath(); c.ellipse(kx, ky, 2.5, 1.6, 0.3, 0, TAU); c.stroke();
      c.beginPath(); c.moveTo(kx, ky + 2); c.lineTo(kx + rng() * 4 - 2, ky + 6 + rng() * 7); c.stroke();
    }
    // cross beams with bolts + rust streaks
    for (let y = 100; y < depth; y += 150) {
      c.fillStyle = '#2c2013';
      c.fillRect(6, y, cwL - 12, 9);
      c.fillStyle = '#4c3a24';
      c.fillRect(6, y, cwL - 12, 2);
      c.fillStyle = 'rgba(0,0,0,0.4)';
      c.fillRect(6, y + 8, cwL - 12, 1);
      for (let bx = 24; bx < cwL - 16; bx += 44) {
        c.fillStyle = '#6a5a48';
        c.beginPath(); c.arc(bx, y + 4.5, 1.6, 0, TAU); c.fill();
        c.fillStyle = '#8a7458';
        c.fillRect(bx - 0.5, y + 3.5, 1, 1);
        c.fillStyle = 'rgba(140,80,40,0.4)';
        c.fillRect(bx - 1, y + 9, 2, 8 + rng() * 12);
      }
    }
    // algae blotches (greener near the sunlit top)
    for (let i = 0; i < depth / 2.2; i++) {
      const ay = rng() * depth, d = ay / depth;
      c.fillStyle = `rgba(${44 - d * 24},${104 - d * 60},${56 - d * 34},${0.2 + rng() * 0.3})`;
      const w = 2 + rng() * 13;
      c.fillRect(12 + rng() * (cwL - 24 - w), ay, w, 1.5 + rng() * 4);
    }
    // moss tufts hanging off the plank seams
    for (let i = 0; i < depth / 26; i++) {
      const my = rng() * depth;
      const mx = 12 + Math.floor(rng() * 5) * 34 + rng() * 4;
      c.fillStyle = 'rgba(60,120,70,0.5)';
      c.beginPath(); c.ellipse(mx, my, 2 + rng() * 3, 1.5, 0, 0, TAU); c.fill();
      c.fillRect(mx - 1, my, 1, 3 + rng() * 5);
    }
    // crust speckles
    for (let i = 0; i < depth; i++) {
      c.fillStyle = rng() < 0.5 ? 'rgba(150,150,140,0.3)' : 'rgba(205,200,185,0.2)';
      c.fillRect(12 + rng() * (cwL - 24), rng() * depth, 1, 1);
    }
    // rounded-off dark edges
    c.fillStyle = 'rgba(0,0,0,0.5)';
    c.fillRect(0, 0, 12, depth);
    c.fillRect(cwL - 12, 0, 12, depth);
    c.fillStyle = 'rgba(0,0,0,0.22)';
    c.fillRect(12, 0, 5, depth);
    c.fillRect(cwL - 17, 0, 5, depth);
    this.wallCanvas = cv;
    this.wallCtx = c;   // kept for stamping scrape scars
  },

  // ---- helpers --------------------------------------------------------------
  bagValue() {
    let v = 0;
    for (const k in this.bag) v += (ITEMS[k] ? ITEMS[k].price : 0) * this.bag[k];
    return v;
  },

  msgSet(m, t = 2.2) { this.msg = m; this.msgT = t; },
  bannerSet(m, t = 1.6) { this.banner = m; this.bannerT = t; },

  nodeAt(mx, my) {
    for (const n of this.nodes) {
      if (!n.alive || n.decor) continue;
      const dx = mx - n.x, dy = my - n.y;
      if (dx * dx + dy * dy < (n.r + 4) * (n.r + 4)) return n;
    }
    return null;
  },

  // ---- pry minigame -----------------------------------------------------------
  startPry(n) {
    const pd = NODE_DEFS[n.kind].pry;
    if (!pd) return;
    const bar = PRYBARS[G.gear.pry];
    this.pry = { n, t: 0, speed: pd.speed * bar.speed, win: pd.win + bar.bonus, marker: 0 };
    SND.pryCreak();
  },

  resolvePry(success) {
    const n = this.pry.n;
    this.pry = null;
    if (success) {
      this.popNode(n);
    } else {
      n.clampT = 0.7;
      n.shake = 1;
      SND.clank();
      this.msgSet(pick(['It clamps down tight!', 'Slipped!', 'Almost had it...']));
      if (n.kind === 'urchin') this.hurtPlayer(0.5);
      this.shakeT = Math.max(this.shakeT, 0.15);
    }
  },

  hurtPlayer(amount) {
    const def = SUITS[G.gear.suit].def;
    const dmg = Math.max(0.5, amount - def);
    G.hearts = Math.round((G.hearts - dmg) * 2) / 2;
    SND.hurt();
    this.flash = 0.5; this.flashCol = '232,60,60';
    this.shakeT = Math.max(this.shakeT, 0.3);
    if (G.hearts <= 0) { G.hearts = 0; this.blackout(); }
  },

  blackout() {
    if (this.over) return;
    this.over = true; this.overT = 0;
    SND.padOff();
    SND.setScene('surface');
  },

  spillBag(n) {
    const keys = Object.keys(this.bag).filter(k => this.bag[k] > 0);
    let spilled = 0;
    while (n-- > 0 && keys.length) {
      const k = pick(keys);
      this.bag[k]--; this.bagCount--; spilled++;
      if (this.bag[k] <= 0) keys.splice(keys.indexOf(k), 1);
      for (let i = 0; i < 3; i++)
        this.particles.push({
          x: Input.mouse.x + rand(-6, 6), y: Input.mouse.y + this.camY + rand(-6, 6),
          vx: rand(-30, 30), vy: rand(20, 70), t: rand(0.6, 1.2), col: ITEMS[k].color, s: 2,
        });
    }
    if (spilled) this.msgSet(`Dropped ${spilled} shells!`);
  },

  popNode(n) {
    n.alive = false;
    const drop = NODE_DEFS[n.kind].drop;
    const gained = [drop];
    // loose pearls are a rare dive treat — most come from cracking at the bench
    if (n.kind === 'oyster' && Math.random() < 0.04) gained.push('pearl');
    for (const it of gained) {
      this.bag[it] = (this.bag[it] || 0) + 1;
      this.bagCount++;
    }
    G.stats.scraped++;
    this.combo = this.comboT > 0 ? this.combo + 1 : 1;
    this.comboT = 2.2;
    SND.pop(1 + Math.min(this.combo, 12) * 0.05);
    if (gained.includes('pearl')) {
      SND.chime(); this.bannerSet('* PEARL! *'); G.stats.pearls++;
    }
    const col = ITEMS[drop].color;
    // spinning shell chunks + dust + a pop ring
    for (let i = 0; i < 10; i++) {
      this.particles.push({
        x: n.x + rand(-3, 3), y: n.y + rand(-3, 3),
        vx: rand(-60, 60), vy: rand(-80, 15), t: rand(0.4, 0.9),
        col: Math.random() < 0.3 ? '#fff' : col, s: rand(1, 2.4),
        rot: rand(TAU), vr: rand(-9, 9), chunk: true,
      });
    }
    for (let i = 0; i < 4; i++) {
      this.particles.push({
        x: n.x + rand(-4, 4), y: n.y + rand(-4, 4),
        vx: rand(-20, 20), vy: rand(-30, 5), t: rand(0.3, 0.6),
        col: 'rgba(210,200,180,0.7)', s: 1,
      });
    }
    this.particles.push({ x: n.x, y: n.y, t: 0.35, ring: true, r: 2, vr: 52, col: 'rgba(255,255,255,0.8)' });
    // stamp a freshly-scraped scar into the piling wood
    if (this.wallCtx) {
      const sx = n.x - (this.WALL_X - 12), sy = n.y;
      const c = this.wallCtx;
      c.fillStyle = 'rgba(126,98,60,0.92)';
      c.beginPath(); c.ellipse(sx, sy, n.r * 0.8, n.r * 0.6, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(58,42,24,0.85)'; c.lineWidth = PIX * 2;
      c.beginPath(); c.ellipse(sx, sy, n.r * 0.8, n.r * 0.6, 0, 0, TAU); c.stroke();
      c.fillStyle = 'rgba(150,150,140,0.55)';
      for (let i = 0; i < 5; i++) {
        const a = rand(TAU);
        c.fillRect(sx + Math.cos(a) * n.r * 0.72, sy + Math.sin(a) * n.r * 0.5, 1, 1);
      }
      c.fillStyle = 'rgba(96,72,44,0.5)';
      c.fillRect(sx - PIX, sy - n.r * 0.4, PIX, n.r * 0.8);
    }
    this.floaters.push({ x: n.x, y: n.y - 8, t: 1, txt: '+' + ITEMS[drop].name, col: '#fff' });
    for (const it of gained) {
      this.flyIcons.push({ img: SPR.icons[it], x: n.x, y: n.y - this.camY, t: 0, rot: rand(-0.4, 0.4), vr: rand(-5, 5) });
    }
    if (navigator.vibrate) { try { navigator.vibrate(this.combo >= 5 ? 22 : 12); } catch (e) {} }
    this.slowT = 0.06;
    this.shakeT = Math.max(this.shakeT, 0.05);
  },

  surface(forced) {
    // deposit bag into storage
    let count = 0, value = 0;
    for (const k in this.bag) {
      G.storage[k] = (G.storage[k] || 0) + this.bag[k];
      count += this.bag[k];
      value += ITEMS[k].price * this.bag[k];
    }
    // remember regrowth state (and apply an overnight regrow that happened mid-dive)
    this.exitGrowth();
    if (G.flags.pendingRegrow) Game.newDayRegrow(true);
    SND.splash();
    SND.setScene('surface');
    if (count > 0) Game.toast(`Stored ${count} shells (worth ~$${value})`);
    if (forced) Game.toast('You surfaced gasping for air! (-1 heart)');
    Game.save();
    Game.go(WorldScene, { at: this.p });
  },

  exitGrowth() {
    const alive = this.nodes.filter(n => !n.decor && n.kind !== 'urchin' && n.alive).length;
    G.growth[this.p] = alive / this.totalHarv;
  },

  // ---- shark event -----------------------------------------------------------
  startShark() {
    this.shark = { state: 'omen', t: 4.2, x: -220, y: H * 0.35, s: 0.55, alpha: 0, sus: 0, dir: 1, bit: false };
    this.gloomTarget = 0.5;
    for (const f of this.fish) f.flee = true;
    SND.setScene('shark');
    this.msgSet('...the water goes quiet.', 3);
  },

  updateShark(dt) {
    const sh = this.shark;
    if (!sh) {
      this.sharkCooldown -= dt;
      this.sharkRollT -= dt;
      if (this.sharkCooldown <= 0 && this.sharkRollT <= 0) {
        this.sharkRollT = 1;
        const depthFrac = this.camY / Math.max(1, this.maxCam);
        const pch = 0.004 + 0.012 * depthFrac + (isNight(G.clock) ? 0.008 : 0)
          + 0.004 * this.p + Math.min(0.004, this.bagValue() / 30000);
        if (Math.random() < pch) this.startShark();
      }
      return;
    }
    sh.t -= dt;
    if (sh.state === 'omen') {
      sh.alpha = 0;
      if (sh.t <= 0) {
        sh.state = 'pass'; sh.t = 4; sh.alpha = 0.35;
        sh.x = -220; sh.y = H * rand(0.25, 0.5); sh.dir = 1; sh.s = 0.55;
        SND.whale();
      }
    } else if (sh.state === 'pass') {
      sh.x += (W + 440) / 4 * dt;
      if (sh.t <= 0) {
        sh.state = 'stare'; sh.t = rand(5.5, 8.5);
        sh.sus = 0; sh.alpha = 0.9;
        sh.x = W + 200; sh.y = H * 0.45; sh.dir = -1; sh.s = 0.8;
        sh.armed = !Input.mouse.down;   // don't bust a click held from before
        this.msgSet('', 0);
      }
    } else if (sh.state === 'stare') {
      // drifts to center, watching you
      sh.x = lerp(sh.x, W * 0.5 + Math.sin(this.time * 0.8) * 30, dt * 1.5);
      sh.y = lerp(sh.y, H * 0.42 + Math.cos(this.time * 0.6) * 12, dt * 1.5);
      sh.s = Math.min(1.2, sh.s + dt * 0.08);
      // suspicion: movement is death
      const spd = Input.mouse.speed;
      if (spd > 26) sh.sus += (spd - 26) * dt * 0.004;
      if (Math.abs(this.camVel) > 4) sh.sus += dt * 0.6;
      if (!Input.mouse.down) sh.armed = true;
      else if (sh.armed) sh.sus = 9;
      if (sh.sus >= 1) {
        sh.state = 'attack'; sh.t = 0.9; sh.bit = false;
      } else if (sh.t <= 0) {
        sh.state = 'leave'; sh.t = 3;
        G.stats.sharkSurvived++;
        SND.relief();
        this.gloomTarget = 0;
        this.msgSet('...it loses interest.', 3);
        this.sharkCooldown = rand(70, 110);
        SND.setScene('dive');
      }
    } else if (sh.state === 'attack') {
      const prog = 1 - sh.t / 0.9;
      sh.s = 1.2 + prog * 5;
      sh.x = lerp(sh.x, W / 2, dt * 6);
      sh.y = lerp(sh.y, H / 2, dt * 6);
      if (!sh.bit && prog > 0.5) {
        sh.bit = true;
        SND.bite();
        this.flash = 0.7; this.flashCol = '255,255,255';
        this.shakeT = 0.6;
        const lose = Math.ceil(this.bagCount * 0.35);
        this.spillBag(lose);
        this.hurtPlayer(2.5);
        this.msgSet('IT GOT YOU', 2);
      }
      if (sh.t <= 0) {
        sh.state = 'leave'; sh.t = 2.5; sh.alpha = 0.5; sh.s = 1.4;
        this.gloomTarget = 0;
        this.sharkCooldown = rand(70, 110);
        SND.setScene('dive');
      }
    } else if (sh.state === 'leave') {
      sh.x -= 170 * dt;   // faces left in every non-pass state, so swim off left
      sh.alpha = Math.max(0, sh.alpha - dt * 0.4);
      if (sh.t <= 0) this.shark = null;
    }
  },

  // ---- update ---------------------------------------------------------------
  update(dt) {
    this.time += dt;
    const eff = this.slowT > 0 ? dt * 0.3 : dt;   // micro slow-mo on pops
    this.slowT -= dt;
    if (this.shakeT > 0) this.shakeT -= dt;
    if (this.flash > 0) this.flash -= dt * 1.6;
    if (this.bagPulse > 0) this.bagPulse -= dt;
    if (this.msgT > 0) this.msgT -= dt;
    if (this.bannerT > 0) this.bannerT -= dt;
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }
    this.gloom = lerp(this.gloom, this.gloomTarget, dt * 1.2);

    // blackout sequence
    if (this.over) {
      this.overT += dt;
      if (this.overT > 3) {
        G.stats.deaths++;
        G.hearts = G.maxHearts;
        this.bag = {}; this.bagCount = 0;
        this.exitGrowth();
        G.day++; G.clock = 0.3;
        Game.newDayRegrow(true);
        Game.save();
        Game.go(HouseScene, { wake: true });
      }
      return;
    }

    // swimming
    let move = 0;
    if (Input.keys['KeyW'] || Input.keys['ArrowUp']) move -= 1;
    if (Input.keys['KeyS'] || Input.keys['ArrowDown']) move += 1;
    const targetVel = move * 85 + Input.wheelDelta * 14;
    this.camVel = lerp(this.camVel, targetVel, dt * 8);
    const before = this.camY;
    this.camY = clamp(this.camY + this.camVel * dt, 0, this.maxCam);
    if (this.camY === 0 || this.camY === this.maxCam) this.camVel *= 0.5;

    // oxygen
    this.air -= dt;
    if (this.air <= 12) {
      this.airBeepT -= dt;
      if (this.airBeepT <= 0) { this.airBeepT = 1; SND.alarm(); }
    }
    if (this.air <= 0) {
      this.hurtPlayer(1);
      if (!this.over) this.surface(true);
      return;
    }

    // surfacing: no magic button — swim to the top and keep kicking
    const holdingUp = Input.keys['KeyW'] || Input.keys['ArrowUp'];
    if (this.camY <= 1 && holdingUp) {
      this.surfaceT += dt;
      if (this.surfaceT > 0.45) { this.surface(false); return; }
    } else {
      this.surfaceT = Math.max(0, this.surfaceT - dt * 2);
    }

    // ---- working the wall: scrape crust, then pry the shell loose --------------
    this.scrapeT -= dt;
    if (this.numbT > 0) this.numbT -= dt;
    const scr = SCRAPERS[G.gear.scraper];
    const mx = Input.mouse.x, my = Input.mouse.y + this.camY;
    const stareLock = this.shark && this.shark.state === 'stare';

    if (this.pry) {
      // pry in progress: marker swings, release in the window
      const p = this.pry;
      p.t += dt;
      p.marker = Math.sin(p.t * p.speed);
      if (!p.n.alive) this.pry = null;
      else if (!Input.mouse.down) {
        if (p.t < 0.22) this.pry = null;              // twitch: cancel, no penalty
        else this.resolvePry(Math.abs(p.marker) <= p.win);
      } else if (p.t > 2.6) {
        this.resolvePry(false);                        // held too long: it clamps
      }
    } else if ((Input.mouse.down || Input.mouse.clicked) && this.numbT <= 0 && !stareLock) {
      const n = this.nodeAt(mx, my);
      if (n) {
        if (n.stage === 'exposed') {
          if (n.kind === 'urchin' && !G.gear.gloves) {
            if (this.scrapeT <= 0) {
              this.scrapeT = 0.55;
              this.hurtPlayer(1);
              this.msgSet('OUCH! Sea urchin! (Pry Gloves would help)');
              for (let i = 0; i < 6; i++)
                this.particles.push({ x: n.x, y: n.y, vx: rand(-40, 40), vy: rand(-40, 40), t: 0.5, col: '#5a3a8a', s: 1 });
            }
          } else if (this.bagCount >= BAGS[G.gear.bag].cap) {
            if (this.scrapeT <= 0) {
              this.scrapeT = 0.5;
              this.msgSet('Bag full! Swim up to the surface!');
              SND.alarm();
            }
          } else if (n.clampT <= 0 && Input.mouse.down) {
            this.startPry(n);
          }
        } else if (n.stage === 'crusted' && this.scrapeT <= 0) {
          this.scrapeT = scr.tick;
          n.hp -= scr.dmg; n.shake = 1;
          SND.scrape();
          for (let i = 0; i < 4; i++)
            this.particles.push({
              x: mx + rand(-5, 5), y: my + rand(-5, 5),
              vx: rand(-30, 30), vy: rand(-45, 10), t: rand(0.25, 0.55),
              col: Math.random() < 0.55 ? '#8a9484' : (G.gear.scraper === 2 && Math.random() < 0.5 ? '#ffe66e' : '#cfc8b8'), s: 1,
            });
          if (Math.random() < 0.4)
            this.bubbles.push({ x: mx + rand(-4, 4), y: Input.mouse.y, r: rand(1, 2.5), v: rand(18, 34), wob: rand(TAU) });
          if (n.hp <= 0) {
            if (n.kind === 'barnacle') {
              // barnacles come straight off with the crust
              if (this.bagCount >= BAGS[G.gear.bag].cap) { n.hp = 1; this.msgSet('Bag full! Swim up to the surface!'); }
              else this.popNode(n);
            } else {
              n.stage = 'exposed';
              n.shake = 1;
              SND.ding();
              this.floaters.push({ x: n.x, y: n.y - n.r - 6, t: 1, txt: 'Exposed! Hold to pry', col: '#a0f2b4' });
              for (let i = 0; i < 8; i++)
                this.particles.push({
                  x: n.x + rand(-n.r, n.r) * 0.7, y: n.y + rand(-n.r, n.r) * 0.6,
                  vx: rand(-40, 40), vy: rand(-55, 5), t: rand(0.3, 0.7),
                  col: '#8a9484', s: rand(1, 2), rot: rand(TAU), vr: rand(-8, 8), chunk: true,
                });
            }
          }
        }
      } else if (this.scrapeT <= 0) {
        this.scrapeT = 0.16;
        if (mx > this.WALL_X && mx < this.WALL_X + this.WALL_W && Math.random() < 0.5) {
          SND.clink();
          this.particles.push({ x: mx, y: my, vx: rand(-15, 15), vy: rand(-25, 5), t: 0.3, col: '#8a8478', s: 1 });
        }
      }
    }
    for (const n of this.nodes) {
      if (n.shake > 0) n.shake -= dt * 4;
      if (n.clampT > 0) n.clampT -= dt;
    }

    // ---- jellyfish -------------------------------------------------------------
    for (const j of this.jellies) {
      j.wy -= j.vy * dt;
      j.x += Math.sin(this.time * 0.9 + j.sway) * 7 * dt;
      if (j.wy < -30) { j.wy = this.maxCam + H + 20; j.x = rand(20, W - 20); }
      if (j.cd > 0) j.cd -= dt;
      const sy = j.wy - this.camY;
      if (sy > -20 && sy < H + 20 && j.cd <= 0) {
        const dx = Input.mouse.x - j.x, dy = Input.mouse.y - sy;
        if (dx * dx + dy * dy < (j.r + 5) * (j.r + 5) && (Input.mouse.down || this.pry)) {
          j.cd = 1.4;
          this.pry = null;
          this.numbT = 1.6;
          this.hurtPlayer(0.5);
          SND.zap();
          this.msgSet('Jellyfish sting! Your paw is numb...');
        }
      }
    }

    // ---- moray eels ------------------------------------------------------------
    for (const n of this.nodes) {
      if (n.kind !== 'eelhole') continue;
      const e = n.eel;
      e.t -= dt;
      if (e.state === 'hidden' && e.t <= 0) { e.state = 'peek'; e.t = 2.2 + rand(0, 1.2); }
      else if (e.state === 'peek') {
        const dx = Input.mouse.x - n.x, dy = (Input.mouse.y + this.camY) - n.y;
        const near = dx * dx + dy * dy < 36 * 36;
        if (near && (Input.mouse.down || this.pry)) {
          e.state = 'strike'; e.t = 0.5; e.bit = false;
        } else if (e.t <= 0) { e.state = 'hidden'; e.t = 3.5 + rand(0, 4); }
      } else if (e.state === 'strike') {
        if (!e.bit && e.t < 0.3) {
          e.bit = true;
          const dx = Input.mouse.x - n.x, dy = (Input.mouse.y + this.camY) - n.y;
          if (dx * dx + dy * dy < 48 * 48) {
            this.pry = null;
            this.hurtPlayer(1);
            this.spillBag(2);
            SND.bite();
            this.msgSet('Moray bite! Watch the dens!');
          }
        }
        if (e.t <= 0) { e.state = 'hidden'; e.t = 5 + rand(0, 4); }
      }
    }

    // ---- schools of fish ---------------------------------------------------------
    for (const s of this.schools) {
      if (this.shark && !s.flee) { s.flee = true; s.speed *= 4; }
      if (!this.shark && s.flee) { s.flee = false; s.speed = rand(22, 34); }
      s.x += s.dir * s.speed * dt;
      s.y += Math.sin(this.time * 0.5 + s.ph) * 8 * dt - (this.camY - before) * 0.2;
      s.y = clamp(s.y, 20, H - 20);
      if (s.x < -80) { s.x = W + 80; s.y = rand(40, H - 40); }
      if (s.x > W + 80) { s.x = -80; s.y = rand(40, H - 40); }
    }

    // barracuda (only past the first piling, or at night)
    if (this.p >= 1 || isNight(G.clock)) {
      const b = this.barra;
      b.t -= dt;
      if (b.state === 'idle' && b.t <= 0 && !this.shark) {
        b.state = 'warn'; b.t = 0.85;
        b.y = clamp(Input.mouse.y, 20, H - 20);
        b.dir = Math.random() < 0.5 ? 1 : -1;
        b.hit = false;
        SND.warn();
      } else if (b.state === 'warn' && b.t <= 0) {
        b.state = 'dash'; b.t = 0.55;
        b.x = b.dir > 0 ? -50 : W + 50;
      } else if (b.state === 'dash') {
        b.x += b.dir * ((W + 120) / 0.55) * dt;
        // on touch, a lifted finger means the paw is pulled back — safe
        const pawOut = Input.mouse.down || !TouchUI.enabled;
        if (!b.hit && pawOut && Math.abs(Input.mouse.x - b.x) < 26 && Math.abs(Input.mouse.y - b.y) < 20) {
          b.hit = true;
          this.hurtPlayer(1);
          SND.bite();
          this.spillBag(3);
          this.msgSet('Barracuda bite!');
        }
        if (b.t <= 0) { b.state = 'idle'; b.t = rand(9, 22); }
      }
    }

    // shark
    this.updateShark(dt);

    // ambient whale groans in the deep
    this.whaleT -= dt;
    if (this.whaleT <= 0) {
      this.whaleT = rand(35, 80);
      if (this.camY / Math.max(1, this.maxCam) > 0.4 && !this.shark) {
        SND.whale();
        if (Math.random() < 0.4) this.msgSet('...you hear something, far away.', 3);
      }
    }

    // particles / floaters / icons / bubbles
    const dcam = this.camY - before;
    for (const pt of this.particles) {
      if (pt.ring) { pt.r += pt.vr * eff; pt.t -= dt; continue; }
      pt.x += pt.vx * eff; pt.y += pt.vy * eff;
      pt.vy += 40 * eff; pt.vx *= (1 - eff * 1.5);
      if (pt.chunk) pt.rot += pt.vr * eff;
      pt.t -= dt;
    }
    this.particles = this.particles.filter(pt => pt.t > 0);
    for (const f of this.floaters) { f.y -= 14 * dt; f.t -= dt * 0.8; }
    this.floaters = this.floaters.filter(f => f.t > 0);
    for (const fi of this.flyIcons) {
      fi.t += dt * 2.2;
      if (fi.t >= 1) this.bagPulse = 0.25;
    }
    this.flyIcons = this.flyIcons.filter(fi => fi.t < 1);
    for (const bu of this.bubbles) {
      bu.y -= bu.v * dt; bu.x += Math.sin(this.time * 3 + bu.wob) * 0.4;
    }
    this.bubbles = this.bubbles.filter(bu => bu.y > -5);
    if (Math.random() < dt * 0.8)
      this.bubbles.push({ x: rand(W), y: H + 4, r: rand(1, 3), v: rand(12, 26), wob: rand(TAU) });

    // fish
    for (const f of this.fish) {
      if (f.flee) {
        f.vx = (f.vx > 0 ? 1 : -1) * 160;
        f.alpha = Math.max(0, f.alpha - dt * 1.5);
      }
      f.x += f.vx * eff;
      f.y += Math.sin(this.time * 2 + f.phase) * 6 * eff - dcam * 0.25;
      const inWall = f.x > this.WALL_X - 8 && f.x < this.WALL_X + this.WALL_W + 8;
      if (!f.flee && (f.x < 4 || f.x > W - 4 || inWall)) f.vx *= -1;
      if (f.y < 6 || f.y > H - 6) f.y = clamp(f.y, 6, H - 6);
      if (f.flee && (f.x < -30 || f.x > W + 30)) {
        // respawn later, calm
        if (!this.shark) { f.flee = false; f.alpha = 1; f.x = f.side ? W - 10 : 10; }
      }
    }

    // marine snow
    for (const s of this.snow) {
      s.y += s.v * eff - dcam * 0.5;
      s.x += Math.sin(this.time + s.drift) * 0.15;
      if (s.y > H) { s.y = -2; s.x = rand(W); }
      if (s.y < -4) { s.y = H; s.x = rand(W); }
    }
  },

  // ---- drawing ---------------------------------------------------------------
  drawNode(ctx, n, sy) {
    if (n.kind === 'star') { this.drawStar(ctx, n, sy); return; }
    if (n.kind === 'anemone') { this.drawAnemone(ctx, n, sy); return; }
    if (n.kind === 'eelhole') { this.drawEelhole(ctx, n, sy); return; }
    const sx = n.x + (n.shake > 0 ? rand(-1.3, 1.3) : 0);
    const jy = sy + (n.shake > 0 ? rand(-1, 1) : 0);
    ctx.save();
    ctx.translate(Math.round(sx * DPX) / DPX, Math.round(jy * DPX) / DPX);
    if (n.clampT > 0) ctx.scale(1, 0.88);   // clamped down tight
    const rng = mulberry32(n.seed);
    const r = n.r;

    // every node is GROWN ON the wood: drop shadow + encrusted attachment ring
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.ellipse(0.8, 1.4, r * 1.02, r * 0.78, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(134,128,114,0.55)';
    ctx.beginPath(); ctx.ellipse(0, 0.6, r * 1.05, r * 0.82, 0, 0, TAU); ctx.fill();
    for (let i = 0; i < 6; i++) {
      const a = rng() * TAU;
      ctx.fillStyle = i % 2 ? 'rgba(184,180,164,0.7)' : 'rgba(92,88,78,0.7)';
      ctx.fillRect(Math.cos(a) * r * 0.95, 0.6 + Math.sin(a) * r * 0.72, 1, 1);
    }

    if (n.kind === 'clam') {
      const tone = Math.floor(rng() * 3);
      const base = ['#c9a06a', '#d9b98a', '#b98f5c'][tone];
      const ridge = ['#8a6a3c', '#9a7a4c', '#7a5c30'][tone];
      const sheen = ['#ecd8ac', '#f2e2bc', '#dcc494'][tone];
      const fan = (s) => {
        ctx.beginPath();
        ctx.moveTo(0, r * 0.65 * s);
        ctx.quadraticCurveTo(-r * 1.15 * s, r * 0.35 * s, -r * 0.85 * s, -r * 0.28 * s);
        ctx.quadraticCurveTo(0, -r * 1.0 * s, r * 0.85 * s, -r * 0.28 * s);
        ctx.quadraticCurveTo(r * 1.15 * s, r * 0.35 * s, 0, r * 0.65 * s);
        ctx.closePath();
      };
      ctx.fillStyle = '#4a2f16';
      fan(1); ctx.fill();
      ctx.fillStyle = base;
      fan(0.86); ctx.fill();
      // concentric growth rings from the umbo
      ctx.strokeStyle = `rgba(122,92,48,0.75)`; ctx.lineWidth = PIX * 2;
      for (let g = 0.35; g < 0.85; g += 0.24) {
        ctx.beginPath();
        ctx.arc(0, r * 0.55, r * g, Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
      }
      // radial ribs
      ctx.strokeStyle = ridge; ctx.lineWidth = PIX * 2;
      for (let a = -2; a <= 2; a++) {
        ctx.beginPath(); ctx.moveTo(0, r * 0.5);
        ctx.lineTo(Math.sin(a * 0.38) * r * 0.8, r * 0.5 - Math.cos(a * 0.38) * r * 1.25);
        ctx.stroke();
      }
      // sheen + umbo knob
      ctx.fillStyle = sheen;
      ctx.fillRect(-r * 0.45, -r * 0.55, r * 0.32, PIX * 2);
      ctx.fillStyle = '#4a2f16';
      ctx.beginPath(); ctx.arc(0, r * 0.55, r * 0.18, 0, TAU); ctx.fill();
    } else if (n.kind === 'mussel') {
      // byssus threads first — the little anchors that make it look attached
      ctx.strokeStyle = 'rgba(214,202,170,0.65)'; ctx.lineWidth = PIX;
      for (let i = 0; i < 3; i++) {
        const a = rng() * 1.4 + 1.0;
        ctx.beginPath(); ctx.moveTo(0, r * 0.25);
        ctx.lineTo(Math.cos(a + Math.PI / 2) * r * 1.25, r * 0.4 + Math.sin(a) * r * 0.5);
        ctx.stroke();
      }
      ctx.save(); ctx.rotate(rng() * 0.9 - 0.45);
      ctx.fillStyle = '#0b1020';
      ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.55, 0.6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#26335e';
      ctx.beginPath(); ctx.ellipse(0.2, 0.2, r - 1.2, r * 0.55 - 1.2, 0.6, 0, TAU); ctx.fill();
      // growth bands along the shell
      ctx.strokeStyle = 'rgba(10,14,28,0.7)'; ctx.lineWidth = PIX;
      ctx.beginPath(); ctx.ellipse(0.6, 0.6, r * 0.62, r * 0.3, 0.6, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(1.0, 1.0, r * 0.34, r * 0.15, 0.6, 0, TAU); ctx.stroke();
      // rim light along the top edge
      ctx.strokeStyle = '#7c92cc'; ctx.lineWidth = PIX * 2;
      ctx.beginPath(); ctx.ellipse(0, 0, r - 1.2, r * 0.55 - 1.2, 0.6, Math.PI * 1.15, Math.PI * 1.7); ctx.stroke();
      ctx.restore();
    } else if (n.kind === 'barnacle') {
      // volcano cone with wall plates
      ctx.fillStyle = '#5c6462';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#a8b0ac';
      ctx.beginPath(); ctx.arc(-0.3, -0.3, r - 1.2, 0, TAU); ctx.fill();
      // radial plate seams
      ctx.strokeStyle = 'rgba(74,84,80,0.8)'; ctx.lineWidth = PIX * 2;
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + rng();
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45);
        ctx.lineTo(Math.cos(a) * (r - 1), Math.sin(a) * (r - 1));
        ctx.stroke();
      }
      // crater with a hint of the critter inside
      ctx.fillStyle = '#232b29';
      ctx.beginPath(); ctx.ellipse(0, 0.4, r * 0.42, r * 0.34, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(200,180,140,0.5)';
      ctx.fillRect(-1, 0, PIX * 2, PIX * 2);
      // sunlit rim
      ctx.strokeStyle = 'rgba(230,232,228,0.65)'; ctx.lineWidth = PIX * 2;
      ctx.beginPath(); ctx.arc(-0.3, -0.3, r - 1.2, Math.PI * 1.1, Math.PI * 1.65); ctx.stroke();
    } else if (n.kind === 'oyster') {
      // layered ruffled shell
      const rot = rng() * 0.8 - 0.4;
      ctx.save(); ctx.rotate(rot);
      const layers = [
        [r * 1.0, r * 0.8, '#333d33'],
        [r * 0.92, r * 0.72, '#5f6d5c'],
        [r * 0.72, r * 0.56, '#78876f'],
        [r * 0.5, r * 0.4, '#9aac90'],
      ];
      for (let i = 0; i < layers.length; i++) {
        const [lx, ly, col] = layers[i];
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.ellipse(i * 0.5, i * 0.35, lx, ly, 0, 0, TAU); ctx.fill();
      }
      // ruffle chips on the lip
      ctx.fillStyle = 'rgba(226,230,218,0.8)';
      for (let i = 0; i < 4; i++) {
        const a = rng() * Math.PI - Math.PI / 2;
        ctx.fillRect(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.65, 1, 1);
      }
      ctx.strokeStyle = 'rgba(38,46,38,0.85)'; ctx.lineWidth = PIX * 2;
      ctx.beginPath(); ctx.moveTo(-r * 0.8, 0.8); ctx.quadraticCurveTo(0, 1.8, r * 0.8, 0.4); ctx.stroke();
      ctx.restore();
    } else if (n.kind === 'abalone') {
      const rot = 0.3;
      ctx.save(); ctx.rotate(rot);
      ctx.fillStyle = '#14332c';
      ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3f8f7f';
      ctx.beginPath(); ctx.ellipse(0.2, 0.2, r - 1.2, r * 0.7 - 1.2, 0, 0, TAU); ctx.fill();
      // iridescent patches
      const cols = ['#6cc9ad', '#b48ac2', '#93d4c2', '#d0c26e'];
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = cols[Math.floor(rng() * cols.length)];
        ctx.fillRect((rng() - 0.5) * r * 1.3, (rng() - 0.5) * r * 0.85, 1.2, 1.2);
      }
      // moving mother-of-pearl shimmer
      const shm = Math.sin(this.time * 1.4 + n.phase) * r * 0.5;
      ctx.fillStyle = 'rgba(240,255,250,0.35)';
      ctx.fillRect(shm - 1, -r * 0.45, 2, r * 0.9);
      // row of respiratory holes along the upper edge
      ctx.fillStyle = '#0e2620';
      for (let i = 0; i < 4; i++)
        ctx.beginPath(), ctx.arc(-r * 0.55 + i * r * 0.34, -r * 0.38, 0.8, 0, TAU), ctx.fill();
      ctx.restore();
    } else if (n.kind === 'urchin') {
      const wig = Math.sin(this.time * 1.5 + n.phase) * 0.1;
      // two-layer spikes: thick dark base, thin light tip
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * TAU + wig + (i % 2) * 0.1;
        const len = r + 2.5 + (i % 3);
        ctx.strokeStyle = '#2c1a44'; ctx.lineWidth = PIX * 3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4);
        ctx.lineTo(Math.cos(a) * len * 0.75, Math.sin(a) * len * 0.75);
        ctx.stroke();
        ctx.strokeStyle = '#6a4a9e'; ctx.lineWidth = PIX;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * len * 0.7, Math.sin(a) * len * 0.7);
        ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
        ctx.stroke();
      }
      ctx.fillStyle = '#221238';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, TAU); ctx.fill();
      ctx.fillStyle = '#42285f';
      ctx.beginPath(); ctx.arc(-0.8, -0.8, r * 0.5, 0, TAU); ctx.fill();
      // dotted test pattern
      ctx.fillStyle = 'rgba(150,110,200,0.6)';
      for (let i = 0; i < 5; i++) {
        const a = rng() * TAU;
        ctx.fillRect(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4, PIX * 2, PIX * 2);
      }
      // hint of danger when hovered
      const dx = Input.mouse.x - n.x, dy = (Input.mouse.y + this.camY) - n.y;
      if (dx * dx + dy * dy < (r + 10) * (r + 10)) {
        ctx.strokeStyle = 'rgba(232,60,60,0.55)';
        ctx.lineWidth = PIX * 2;
        ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, TAU); ctx.stroke();
      }
    }
    // crust overlay: lumps chip away one by one as you scrape
    if (n.stage === 'crusted') {
      const frac = n.hp / n.maxHp;
      const crng = mulberry32(n.seed + 9);
      const lumps = 9;
      const visible = Math.ceil(lumps * frac);
      for (let i = 0; i < lumps; i++) {
        // draw all rng values first so lump shapes stay stable as they vanish
        const a = crng() * TAU;
        const rr = crng() * n.r * 0.72;
        const lr = n.r * (0.3 + crng() * 0.3);
        const rot = crng() * 2;
        if (i >= visible) continue;
        ctx.fillStyle = ['#6e7d6a', '#8a9484', '#5c6a58'][i % 3];
        ctx.beginPath(); ctx.ellipse(Math.cos(a) * rr, Math.sin(a) * rr * 0.75, lr, lr * 0.75, rot, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(200,208,196,0.5)';
        ctx.fillRect(Math.cos(a) * rr - lr * 0.3, Math.sin(a) * rr * 0.75 - lr * 0.4, 1.5, 1);
      }
      // dusting of grit over everything still crusted
      ctx.fillStyle = 'rgba(150,158,146,0.5)';
      for (let i = 0; i < visible; i++) {
        const a = crng() * TAU, rr = crng() * n.r * 0.9;
        ctx.fillRect(Math.cos(a) * rr, Math.sin(a) * rr * 0.75, 1, 1);
      }
    }
    // exposed and ready to pry: soft beckoning glow
    if (n.stage === 'exposed' && n.kind !== 'urchin') {
      ctx.strokeStyle = `rgba(160,242,180,${0.28 + Math.sin(this.time * 3 + n.phase) * 0.16})`;
      ctx.lineWidth = PIX * 2;
      ctx.beginPath(); ctx.ellipse(0, 0.5, n.r * 1.14, n.r * 0.92, 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  },

  drawStar(ctx, n, sy) {
    ctx.save();
    ctx.translate(Math.round(n.x * DPX) / DPX, Math.round(sy * DPX) / DPX);
    const wig = Math.sin(this.time * 0.7 + n.phase) * 0.07;
    ctx.rotate(n.phase + wig);
    const cols = [['#e8735a', '#f2957e'], ['#d85a8a', '#e87aa8'], ['#c86a3c', '#e88a5c']];
    const [base, light] = cols[n.seed % 3];
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(1, 1.2, n.r * 1.1, n.r * 0.9, 0, 0, TAU); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU - Math.PI / 2;
      ctx.fillStyle = base;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * n.r * 0.5, Math.sin(a) * n.r * 0.5, n.r * 0.52, n.r * 0.24, a, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(0, 0, n.r * 0.42, 0, TAU); ctx.fill();
    ctx.fillStyle = light;
    ctx.beginPath(); ctx.arc(-0.5, -0.5, n.r * 0.24, 0, TAU); ctx.fill();
    // bumps down each arm
    ctx.fillStyle = light;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU - Math.PI / 2;
      ctx.fillRect(Math.cos(a) * n.r * 0.55, Math.sin(a) * n.r * 0.55, 1, 1);
      ctx.fillRect(Math.cos(a) * n.r * 0.8, Math.sin(a) * n.r * 0.8, PIX * 2, PIX * 2);
    }
    ctx.restore();
  },

  drawAnemone(ctx, n, sy) {
    ctx.save();
    ctx.translate(Math.round(n.x * DPX) / DPX, Math.round(sy * DPX) / DPX);
    // base
    ctx.fillStyle = '#7a3c46';
    ctx.beginPath(); ctx.ellipse(0, 1.5, n.r * 0.9, n.r * 0.55, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#94505a';
    ctx.beginPath(); ctx.ellipse(0, 0.8, n.r * 0.7, n.r * 0.4, 0, 0, TAU); ctx.fill();
    // tentacles swaying with the water
    for (let i = 0; i < 9; i++) {
      const a = (i / 9 - 0.5) * 2.4;
      const sw = Math.sin(this.time * 1.6 + n.phase + i * 0.8) * 2.4;
      ctx.strokeStyle = i % 2 ? '#8ad0c2' : '#aee2d2';
      ctx.lineWidth = PIX * 2;
      ctx.beginPath();
      ctx.moveTo(a * n.r * 0.4, 0);
      ctx.quadraticCurveTo(a * n.r * 0.6 + sw * 0.5, -n.r * 0.7, a * n.r * 0.8 + sw, -n.r * 1.25);
      ctx.stroke();
      ctx.fillStyle = '#f2b8d0';
      ctx.fillRect(a * n.r * 0.8 + sw - PIX, -n.r * 1.25 - PIX, PIX * 2, PIX * 2);
    }
    ctx.restore();
  },

  drawEelhole(ctx, n, sy) {
    ctx.save();
    ctx.translate(Math.round(n.x * DPX) / DPX, Math.round(sy * DPX) / DPX);
    // rocky rim + dark den
    ctx.fillStyle = '#1c1610';
    ctx.beginPath(); ctx.ellipse(0, 0, n.r + 2, n.r * 0.8 + 1.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0a0805';
    ctx.beginPath(); ctx.ellipse(0, 0, n.r, n.r * 0.75, 0, 0, TAU); ctx.fill();
    const rrng = mulberry32(n.seed);
    ctx.fillStyle = '#4a4238';
    for (let i = 0; i < 7; i++) {
      const a = rrng() * TAU;
      ctx.fillRect(Math.cos(a) * (n.r + 1.5), Math.sin(a) * (n.r * 0.8 + 1), 2, 1.5);
    }
    const e = n.eel;
    if (e.state === 'peek') {
      // eyes glowing in the dark, sizing you up
      const g = 0.65 + Math.sin(this.time * 5 + n.phase) * 0.3;
      ctx.fillStyle = `rgba(150,255,140,${g})`;
      ctx.fillRect(-4, -2, 2, 2);
      ctx.fillRect(2, -2, 2, 2);
      ctx.fillStyle = 'rgba(60,80,50,0.8)';
      ctx.beginPath(); ctx.ellipse(0, 2, n.r * 0.5, n.r * 0.3, 0, 0, TAU); ctx.fill();
    } else if (e.state === 'strike') {
      const prog = 1 - e.t / 0.5;
      const ext = Math.sin(prog * Math.PI) * 42;
      const ang = Math.atan2((Input.mouse.y + this.camY) - n.y, Input.mouse.x - n.x);
      ctx.rotate(ang);
      // body tube
      ctx.fillStyle = '#3c5a3a';
      ctx.fillRect(0, -4, ext, 8);
      ctx.fillStyle = '#54774e';
      ctx.fillRect(0, -4, ext, 3);
      // head with open jaw
      ctx.save();
      ctx.translate(ext, 0);
      ctx.fillStyle = '#3c5a3a';
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 5.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#28211c';
      ctx.beginPath(); ctx.moveTo(2, -1); ctx.lineTo(11, -5); ctx.lineTo(11, 5); ctx.lineTo(2, 1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8e4da';
      ctx.fillRect(8, -4, 1.5, 2); ctx.fillRect(8, 2, 1.5, 2);
      ctx.fillStyle = '#f2ff9a';
      ctx.fillRect(-2, -3.5, 2, 2);
      ctx.restore();
    }
    ctx.restore();
  },

  drawShark(ctx, sh) {
    if (!sh || sh.alpha <= 0 || sh.state === 'omen') return;
    ctx.save();
    ctx.globalAlpha = clamp(sh.alpha, 0, 1);
    ctx.translate(sh.x, sh.y);
    const dir = sh.state === 'pass' ? 1 : -1;
    ctx.scale(sh.s * dir, sh.s);
    const body = '#1c262e', belly = '#2a3742';
    // body
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, 0, 62, 17, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = belly;
    ctx.beginPath(); ctx.ellipse(0, 5, 56, 10, 0, 0, TAU); ctx.fill();
    // tail
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-58, 0); ctx.lineTo(-84, -16 + Math.sin(this.time * 6) * 3); ctx.lineTo(-78, 0);
    ctx.lineTo(-84, 12); ctx.closePath(); ctx.fill();
    // dorsal fin
    ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(4, -30); ctx.lineTo(14, -14); ctx.closePath(); ctx.fill();
    // pectoral
    ctx.beginPath(); ctx.moveTo(8, 8); ctx.lineTo(-6, 24); ctx.lineTo(20, 12); ctx.closePath(); ctx.fill();
    // gills
    ctx.strokeStyle = '#101820'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(22 + i * 4, -8); ctx.lineTo(20 + i * 4, 8); ctx.stroke();
    }
    // old scars across the snout — this one has survived worse than you
    ctx.strokeStyle = 'rgba(178,188,192,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(34, -13); ctx.lineTo(41, -8);
    ctx.moveTo(38, -14); ctx.lineTo(45, -9);
    ctx.moveTo(52, 0); ctx.lineTo(58, -2);
    ctx.stroke();
    // eye — the horror bit
    ctx.fillStyle = '#e8e4da';
    ctx.beginPath(); ctx.arc(44, -5, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(44 + (sh.state === 'stare' ? 1 : 0), -5, 1.6, 0, TAU); ctx.fill();
    if (sh.state === 'stare' && Math.sin(this.time * 9) > 0.7) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(45, -7, 1, 1);
    }
    // mouth
    if (sh.state === 'attack') {
      ctx.fillStyle = '#4a0e12';
      ctx.beginPath(); ctx.moveTo(62, 2); ctx.lineTo(30, 14); ctx.lineTo(62, 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8e4da';
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(36 + i * 5, 6 + i * 0.8); ctx.lineTo(39 + i * 5, 11 + i * 0.8); ctx.lineTo(42 + i * 5, 6 + i * 0.8);
        ctx.closePath(); ctx.fill();
      }
    } else {
      ctx.strokeStyle = '#101820'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(58, 6); ctx.lineTo(40, 9); ctx.stroke();
    }
    ctx.restore();
  },

  drawJaws(ctx, prog) {
    // full-screen jaws closing from top and bottom
    const close = clamp(prog, 0, 1);
    const reach = close * (H / 2 + 10);
    ctx.fillStyle = '#0a0508';
    ctx.fillRect(0, 0, W, reach - 14);
    ctx.fillRect(0, H - reach + 14, W, reach);
    ctx.fillStyle = '#e8e4da';
    for (let i = 0; i < 12; i++) {
      const x = i * (W / 12) + 8;
      ctx.beginPath();
      ctx.moveTo(x - 14, reach - 14); ctx.lineTo(x, reach + 12); ctx.lineTo(x + 14, reach - 14);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - 14 + 16, H - reach + 14); ctx.lineTo(x + 16, H - reach - 12); ctx.lineTo(x + 14 + 16, H - reach + 14);
      ctx.closePath(); ctx.fill();
    }
  },

  draw(ctx) {
    ctx.save();
    if (this.shakeT > 0) ctx.translate(irand(-2, 2), irand(-2, 2));

    // background: banded pixel gradient by depth
    const depthFrac = this.camY / (this.maxCam + 1);
    const night = isNight(G.clock) ? 0.55 : 0;
    const mixTop = clamp(depthFrac + night * 0.4, 0, 1);
    const c1 = [lerp(26, 4, mixTop), lerp(106, 18, mixTop), lerp(138, 30, mixTop)].map(Math.round);
    const c2 = [lerp(12, 2, mixTop), lerp(60, 8, mixTop), lerp(88, 16, mixTop)].map(Math.round);
    bandedFill(ctx, 0, 0, W, H, c1, c2, 10, false);

    // far silhouettes: rock spires + a distant kelp forest, gentle parallax
    ctx.fillStyle = 'rgba(6,20,30,0.5)';
    for (let i = 0; i < 3; i++) {
      const bx = [50, 420, 120][i];
      const topY = H - 40 - i * 30 + this.camY * 0.06 - (this.maxCam * 0.06);
      ctx.beginPath();
      ctx.moveTo(bx - 26, H + 20);
      ctx.lineTo(bx, topY + this.maxCam * 0.06 - this.camY * 0.02 + 60);
      ctx.lineTo(bx + 22, H + 20);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(10,34,30,0.45)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const kx = 20 + i * 110 + (i % 2) * 30;
      const sw = Math.sin(this.time * 0.7 + i * 1.7);
      ctx.beginPath();
      ctx.moveTo(kx, H + 10);
      ctx.quadraticCurveTo(kx + sw * 10, H - 60 - this.camY * 0.03, kx + sw * 20, H - 130 - this.camY * 0.03);
      ctx.stroke();
    }

    // god rays near the surface
    if (this.camY < 180 && !night) {
      ctx.save();
      ctx.globalAlpha = 0.1 * (1 - this.camY / 180);
      for (let i = 0; i < 5; i++) {
        const x = 40 + i * 100 + Math.sin(this.time * 0.4 + i) * 18;
        ctx.fillStyle = '#cfeaf5';
        ctx.beginPath();
        ctx.moveTo(x, -10); ctx.lineTo(x + 34, -10);
        ctx.lineTo(x + 90, H); ctx.lineTo(x + 40, H);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 0.16 * (1 - this.camY / 180);
      ctx.fillStyle = '#e8f6fc';
      for (let i = 0; i < 3; i++) {
        const x = 90 + i * 150 + Math.sin(this.time * 0.5 + i * 2) * 22;
        ctx.beginPath();
        ctx.moveTo(x, -10); ctx.lineTo(x + 10, -10);
        ctx.lineTo(x + 34, H); ctx.lineTo(x + 16, H);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // shark far pass (behind wall)
    if (this.shark && this.shark.state === 'pass') this.drawShark(ctx, this.shark);

    // ambient fish
    for (const f of this.fish) {
      if (f.alpha <= 0) continue;
      ctx.save();
      ctx.globalAlpha = f.alpha * 0.8;
      ctx.fillStyle = '#0e2c3a';
      const fd = f.vx > 0 ? 1 : -1;
      ctx.translate(f.x, f.y);
      ctx.scale(fd, 1);
      ctx.beginPath(); ctx.ellipse(0, 0, f.size, f.size * 0.45, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-f.size, 0); ctx.lineTo(-f.size - 3, -2); ctx.lineTo(-f.size - 3, 2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // schools of little fish weaving behind the piling
    for (const s of this.schools) {
      for (const m of s.members) {
        const fx = s.x + m.ox * s.dir;
        const fy = s.y + m.oy + Math.sin(this.time * 3 + m.ph) * 2.2;
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(s.dir, 1);
        ctx.fillStyle = 'rgba(122,172,192,0.55)';
        ctx.beginPath(); ctx.ellipse(0, 0, 2.8, 1.2, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2.6, 0); ctx.lineTo(-4.4, -1.4); ctx.lineTo(-4.4, 1.4); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // the piling wall (DPX-dense texture)
    if (this.wallCanvas) {
      ctx.drawImage(this.wallCanvas,
        0, this.camY * DPX, this.wallCanvas.width, H * DPX,
        this.WALL_X - 12, 0, this.wallCanvas.width / DPX, H);
    }

    // dancing caustic light on the wall near the surface
    if (this.camY < 170 && !night) {
      const cAlpha = 0.85 * (1 - this.camY / 170);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 7; i++) {
        const wy = i * 26 + Math.sin(this.time * 0.6 + i * 1.7) * 12;
        const sy = wy - this.camY;
        if (sy < -10 || sy > H) continue;
        const cx = this.WALL_X + 16 + ((i * 53 + Math.sin(this.time * 0.8 + i) * 30 + 200) % (this.WALL_W - 32));
        ctx.fillStyle = `rgba(140,200,230,${0.05 * cAlpha})`;
        ctx.beginPath(); ctx.ellipse(cx, sy, 24, 7, Math.sin(this.time + i) * 0.3, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(190,235,255,${0.05 * cAlpha})`;
        ctx.beginPath(); ctx.ellipse(cx + 6, sy + 2, 11, 3.5, 0, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    // kelp strands swaying along the piling edges
    for (let i = 0; i < 6; i++) {
      const left = i % 2 === 0;
      const ax = left ? this.WALL_X - 10 : this.WALL_X + this.WALL_W + 10;
      const anchorWorldY = 90 + i * 150;
      const ay = anchorWorldY - this.camY;
      if (ay < -120 || ay > H + 130) continue;
      const segs = 12 + (i % 3) * 3;
      ctx.strokeStyle = 'rgba(34,104,66,0.9)';
      ctx.lineWidth = 2;
      let px = ax, py = ay;
      ctx.beginPath(); ctx.moveTo(px, py);
      for (let s = 1; s <= segs; s++) {
        const sway = Math.sin(this.time * 1.15 + i * 1.9 + s * 0.5) * s * 0.5;
        const nx2 = ax + sway + (left ? -s * 0.25 : s * 0.25);
        const ny2 = ay - s * 6.5;
        ctx.lineTo(nx2, ny2);
        // leaf nubs alternating sides
        if (s % 2 === 0 && s > 2) {
          ctx.save();
          ctx.fillStyle = 'rgba(56,140,88,0.85)';
          ctx.beginPath();
          ctx.ellipse(nx2 + (s % 4 === 0 ? 3 : -3), ny2, 3.2, 1.3, s % 4 === 0 ? 0.5 : -0.5, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
        px = nx2; py = ny2;
      }
      ctx.stroke();
    }

    // nodes
    for (const n of this.nodes) {
      if (!n.alive) continue;
      const sy = n.y - this.camY;
      if (sy < -30 || sy > H + 30) continue;
      this.drawNode(ctx, n, sy);
    }

    // pry minigame bar above the shell being levered
    if (this.pry) {
      const p = this.pry;
      const bx = clamp(p.n.x, 60, W - 60);
      const by = p.n.y - this.camY - p.n.r - 18;
      uiPanel(ctx, bx - 30, by - 2, 60, 12, 0.92);
      // green window
      const halfW = 26;
      const winPx = p.win * halfW;
      ctx.fillStyle = '#14301c';
      ctx.fillRect(bx - halfW, by + 1, halfW * 2, 6);
      ctx.fillStyle = '#3f9a58';
      ctx.fillRect(bx - winPx, by + 1, winPx * 2, 6);
      ctx.fillStyle = 'rgba(180,255,200,0.5)';
      ctx.fillRect(bx - winPx, by + 1, winPx * 2, 1);
      // swinging marker
      const mxk = bx + p.marker * halfW;
      ctx.fillStyle = '#ffe66e';
      ctx.beginPath();
      ctx.moveTo(mxk, by + 7.5); ctx.lineTo(mxk - 3, by + 12.5); ctx.lineTo(mxk + 3, by + 12.5);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(mxk - PIX, by + 1, PIX * 2, 6);
      text(ctx, 'release!', bx, by - 10, { size: 7, color: '#ffe6b0', align: 'center' });
    }

    // particles (world space)
    for (const pt of this.particles) {
      ctx.globalAlpha = clamp(pt.t * 2, 0, 1);
      if (pt.ring) {
        ctx.strokeStyle = pt.col; ctx.lineWidth = PIX * 2;
        ctx.beginPath(); ctx.arc(pt.x, pt.y - this.camY, pt.r, 0, TAU); ctx.stroke();
      } else if (pt.chunk) {
        ctx.save();
        ctx.translate(pt.x, pt.y - this.camY);
        ctx.rotate(pt.rot);
        ctx.fillStyle = pt.col;
        ctx.fillRect(-pt.s / 2, -pt.s / 2, pt.s, pt.s * 0.7);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(-pt.s / 2, -pt.s / 2, pt.s, PIX);
        ctx.restore();
      } else {
        ctx.fillStyle = pt.col;
        ctx.fillRect(Math.round(pt.x), Math.round(pt.y - this.camY), pt.s, pt.s);
      }
    }
    ctx.globalAlpha = 1;

    // floaters
    for (const f of this.floaters) {
      ctx.globalAlpha = clamp(f.t, 0, 1);
      text(ctx, f.txt, f.x, f.y - this.camY, { size: 7, color: f.col, align: 'center' });
    }
    ctx.globalAlpha = 1;

    // bubbles
    ctx.strokeStyle = 'rgba(200,230,240,0.5)';
    for (const bu of this.bubbles) {
      ctx.beginPath(); ctx.arc(bu.x, bu.y, bu.r, 0, TAU); ctx.stroke();
    }

    // marine snow
    ctx.fillStyle = 'rgba(210,225,230,0.35)';
    for (const s of this.snow) ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);

    // jellyfish
    for (const j of this.jellies) {
      const sy = j.wy - this.camY;
      if (sy < -30 || sy > H + 30) continue;
      const pulse = 1 + Math.sin(this.time * 2.2 + j.sway) * 0.14;
      ctx.save();
      ctx.translate(j.x, sy);
      // tentacles
      for (let i = 0; i < 5; i++) {
        const tx = (i - 2) * j.r * 0.32;
        ctx.strokeStyle = i % 2 ? 'rgba(232,160,200,0.4)' : 'rgba(200,138,224,0.4)';
        ctx.lineWidth = PIX * 2;
        ctx.beginPath();
        ctx.moveTo(tx, j.r * 0.3);
        ctx.quadraticCurveTo(tx + Math.sin(this.time * 2.6 + i) * 3, j.r * 0.9, tx + Math.sin(this.time * 1.8 + i * 2) * 5, j.r * 1.7);
        ctx.stroke();
      }
      // bell
      ctx.fillStyle = 'rgba(232,160,200,0.55)';
      ctx.beginPath(); ctx.ellipse(0, 0, j.r * pulse, j.r * 0.8 / pulse, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(248,208,230,0.55)';
      ctx.beginPath(); ctx.ellipse(-j.r * 0.2, -j.r * 0.2, j.r * 0.55 * pulse, j.r * 0.4, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
      if (night) {
        ctx.fillStyle = 'rgba(248,190,225,0.12)';
        ctx.beginPath(); ctx.arc(0, 0, j.r * 1.6, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    // bioluminescent plankton after dark
    if (night) {
      for (const pl of this.plankton) {
        const py = ((pl.y - this.time * pl.v) % H + H) % H;
        const tw = Math.abs(Math.sin(this.time * 1.4 + pl.ph));
        ctx.fillStyle = `rgba(122,242,232,${0.25 + tw * 0.45})`;
        ctx.fillRect(pl.x + Math.sin(this.time * 0.7 + pl.ph) * 4, py, PIX * 2, PIX * 2);
      }
    }

    // barracuda
    const b = this.barra;
    if (b && b.state === 'warn') {
      const bx = b.dir > 0 ? 10 : W - 14;
      if (Math.sin(this.time * 18) > 0) text(ctx, '!', bx, b.y - 6, { size: 14, color: '#ff5a4a', align: 'center' });
    } else if (b && b.state === 'dash') {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(b.dir, 1);
      // motion streaks
      ctx.fillStyle = 'rgba(122,158,172,0.28)';
      ctx.fillRect(-58, -2, 26, 1);
      ctx.fillRect(-48, 1, 18, 1);
      ctx.fillRect(-52, -4.5, 14, 1);
      // body with belly sheen
      ctx.fillStyle = '#33505c';
      ctx.beginPath(); ctx.ellipse(0, 0, 27, 5.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5a7e8c';
      ctx.beginPath(); ctx.ellipse(2, 1.5, 23, 3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8fb0ba';
      ctx.beginPath(); ctx.ellipse(4, 2.4, 18, 1.4, 0, 0, TAU); ctx.fill();
      // tail + fins
      ctx.fillStyle = '#20343c';
      ctx.beginPath(); ctx.moveTo(-25, 0); ctx.lineTo(-36, -7); ctx.lineTo(-33, 0); ctx.lineTo(-36, 7); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4, -4.5); ctx.lineTo(2, -9); ctx.lineTo(7, -4.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, 4.5); ctx.lineTo(4, 8); ctx.lineTo(9, 4.5); ctx.closePath(); ctx.fill();
      // toothy jaw + eye
      ctx.strokeStyle = '#141f26'; ctx.lineWidth = PIX * 2;
      ctx.beginPath(); ctx.moveTo(26, 1.5); ctx.lineTo(16, 3.5); ctx.stroke();
      ctx.fillStyle = '#e8e4da';
      ctx.fillRect(19, 1.5, 1, 1.5);
      ctx.fillRect(22, 1.2, 1, 1.5);
      ctx.fillStyle = '#fff';
      ctx.fillRect(20, -2.5, 2, 2);
      ctx.fillStyle = '#0a0f14';
      ctx.fillRect(20.7, -2, 1, 1);
      ctx.restore();
    }

    // darkness of the deep (with headlamp hole)
    const darkBase = clamp(depthFrac * 0.72 + night * 0.35, 0, 0.9) + this.gloom * 0.5;
    const dark = clamp(darkBase, 0, 0.94);
    if (dark > 0.02) {
      if (!this._darkCv) {
        this._darkCv = document.createElement('canvas');
        this._darkCv.width = W * DPX; this._darkCv.height = H * DPX;
        this._darkCtx = this._darkCv.getContext('2d');
        this._darkCtx.scale(DPX, DPX);
      }
      const dc = this._darkCtx;
      dc.clearRect(0, 0, W, H);
      dc.fillStyle = `rgba(2,6,10,${dark})`;
      dc.fillRect(0, 0, W, H);
      if (G.gear.lamp) {
        dc.globalCompositeOperation = 'destination-out';
        const rg = dc.createRadialGradient(Input.mouse.x, Input.mouse.y, 10, Input.mouse.x, Input.mouse.y, 95);
        rg.addColorStop(0, 'rgba(0,0,0,0.95)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        dc.fillStyle = rg;
        dc.beginPath(); dc.arc(Input.mouse.x, Input.mouse.y, 96, 0, TAU); dc.fill();
        dc.globalCompositeOperation = 'source-over';
      }
      ctx.drawImage(this._darkCv, 0, 0, W, H);
      if (G.gear.lamp) {
        ctx.fillStyle = 'rgba(255,240,190,0.06)';
        ctx.beginPath(); ctx.arc(Input.mouse.x, Input.mouse.y, 60, 0, TAU); ctx.fill();
      }
    }

    // shark stare / attack / leave (in front)
