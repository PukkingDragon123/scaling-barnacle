<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mr. Otto's Clam Farm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#1a1208;
    /* iOS rubber-bands the document even with overflow:hidden, which drags the
       whole picture up and down under your thumb while you play. */
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  /* THE LETTERBOX. The game is 16:9; a tablet held upright is 3:4, so on an iPad
     in portrait the bands above and below the picture are bigger than the
     picture. Flat black there reads as a broken page, so it is a desk: warm
     boards with the sheet lying on them. */
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
    background:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 2px,
        rgba(0,0,0,0.00) 2px, rgba(0,0,0,0.00) 46px),
      linear-gradient(#3a2716 0%, #2a1c10 55%, #1a1208 100%);
  }
  canvas {
    cursor: none;
    background:#000;
    display:block;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    /* the sheet sits ON the desk, so it casts one */
    box-shadow: 0 0.6vmin 2.4vmin rgba(0,0,0,0.55);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1920" height="1080"></canvas></div>
<script src="assets/manifest.js"></script>
<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/sky.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/dive.js"></script>
<script src="js/world.js"></script>
<script src="js/house.js"></script>
<script src="js/shop.js"></script>
<script src="js/bench.js"></script>
<script src="js/farm.js"></script>
<script src="js/hotbar.js"></script>
<script src="js/npc.js"></script>
<script src="js/stock.js"></script>
<script src="js/craft.js"></script>
<script src="js/battle.js"></script>
<script src="js/divefx.js"></script>
<script src="js/craftgate.js"></script>
<script src="js/skills.js"></script>
<script src="js/inv.js"></script>
<script src="js/tame.js"></script>
<script src="js/mining.js"></script>
<script src="js/ocean.js"></script>
<script src="js/font.js"></script>

<script src="js/hood.js"></script>
<script src="js/map.js"></script>
<script src="js/uibar.js"></script>
<script src="js/integrate.js"></script>
</body>
</html>
