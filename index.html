<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mr. Otto's Clam Farm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; height:100%; background:#070b12; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
    background:#000;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script src="assets/manifest.js"></script>
<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/dive.js"></script>
<script src="js/world.js"></script>
<script src="js/house.js"></script>
<script src="js/shop.js"></script>
<script src="js/bench.js"></script>
<script src="js/main.js"></script>
</body>
</html>
